<title>Bitácora de Obra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: lámina de arquitectura. Riel de índice de láminas a la izquierda, hoja con cuadro de rótulo (carátula) y pestañas de trabajo. */
:root{
  --paper:#eceeef; --sheet:#fbfbfa; --ink:#121c26; --mute:#5d6975; --rule:#cfd4d8; --rule2:#e1e4e6;
  --blue:#173e63; --blue-soft:#e3ebf3; --signal:#e4570f; --signal-soft:#fdebe1; --ok:#1f7a4d; --warn:#b7791f; --bad:#b3261e;
  --display:'Archivo','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1318; --sheet:#151c23; --ink:#e9edf0; --mute:#8e9aa6; --rule:#2b3640; --rule2:#202a33;
  --blue:#8fb7dd; --blue-soft:#1b2a3a; --signal:#ff7a3c; --signal-soft:#33211a; --ok:#4cc38a; --warn:#e0a63e; --bad:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1318; --sheet:#151c23; --ink:#e9edf0; --mute:#8e9aa6; --rule:#2b3640; --rule2:#202a33;
  --blue:#8fb7dd; --blue-soft:#1b2a3a; --signal:#ff7a3c; --signal-soft:#33211a; --ok:#4cc38a; --warn:#e0a63e; --bad:#ff7b72; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.brand{font:800 18px/1 var(--display);font-stretch:90%;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px;min-width:0}
.brand i{width:10px;height:10px;background:var(--signal);display:inline-block}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:flex;gap:4px;margin-left:auto}
.week b{font:500 11px var(--mono);width:30px;height:26px;display:grid;place-items:center;border:1px solid #ffffff33;color:#ffffff88}
.week b.v{color:var(--paper);border-color:#ffffffaa}
.week b.t{background:var(--signal);border-color:var(--signal);color:#fff}
.sync{font:500 11px var(--mono);display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid #ffffff33;border-radius:99px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7bd8a6}
.sync.saving i{background:#f0b84a;animation:pulse 1s infinite}.sync.err i{background:#ff7b72}.sync.off i{background:#888}
@keyframes pulse{50%{opacity:.3}}
/* rail */
.rail{background:var(--sheet);border-right:1px solid var(--rule);overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.rail h6{margin:10px 6px 4px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.joint{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid var(--blue);background:var(--blue-soft);color:var(--blue);font:700 14px var(--display);font-stretch:95%;letter-spacing:.03em;text-transform:uppercase;text-align:left}
.joint.sel{background:var(--blue);color:var(--sheet)}
.sh{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;background:none;border-bottom:1px solid var(--rule2)}
.sh:hover{background:var(--paper)}
.sh.sel{background:var(--signal-soft);border-color:var(--signal)}
.sh .n{font:500 11px var(--mono);color:var(--mute);grid-row:span 2;align-self:center}
.sh .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .m{display:flex;align-items:center;gap:8px;font:400 11px var(--mono);color:var(--mute)}
.bar{flex:1;height:4px;background:var(--rule);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.add{margin-top:6px;border:1px dashed var(--mute);background:none;padding:9px;color:var(--mute);font-weight:500}
.add:hover{color:var(--signal);border-color:var(--signal)}
.addf input{width:100%;margin-top:6px;border:1px dashed var(--mute);background:none;padding:9px 10px;font-weight:500}
.addf input:focus{border-color:var(--signal);outline:none;background:var(--sheet)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.donut{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}
.donut::before{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--sheet)}
.donut b{position:relative;font:800 22px var(--display)}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;margin-right:8px}
.hb{display:grid;grid-template-columns:minmax(80px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule2)}
.hb[data-act]{cursor:pointer}.hb[data-act]:hover{background:var(--paper)}
.hb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.hb b{font:500 12px var(--mono);min-width:38px;text-align:right}
.bar.big4{height:10px}
.cal{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wk{display:flex;flex-direction:column;gap:6px;align-items:center}.wk small{font:10px var(--mono);color:var(--mute)}
.wk.lab div{height:34px;display:grid;align-items:center;font:500 11px var(--mono);color:var(--mute);padding-right:6px}
.cell{width:38px;height:34px;display:grid;place-items:center;font:500 12px var(--mono);border:1px solid var(--rule);color:var(--mute)}
.cell.hit{background:var(--ok);border-color:var(--ok);color:#fff}.cell.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.cell.now{border:2px solid var(--signal)}
.drive{margin-top:auto;padding:10px 6px 0;font-size:12px;color:var(--mute)}
.drive a{color:var(--blue);font-weight:600}
/* main */
.main{overflow:auto;padding:22px clamp(16px,3vw,36px) 60px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.banner{padding:12px 14px;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--sheet));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:600}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.alt{background:none;color:var(--ink);border-color:var(--rule)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:none;color:var(--mute);padding:2px 6px}.ghost:hover{color:var(--bad)}
/* title block */
.tb{background:var(--sheet);border:2px solid var(--ink);display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.tb>div{padding:8px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.tb label{display:block;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.tb input{width:100%;border:none;background:none;padding:2px 0;font-weight:600;font-size:14px;border-bottom:1px dashed transparent}
.tb input:hover,.tb input:focus{border-bottom-color:var(--signal);outline:none}
.tb .name{grid-column:1/9;padding:16px 16px 14px}
.tb .name input{font:800 clamp(26px,4vw,40px)/1.05 var(--display);font-stretch:88%;text-transform:uppercase;letter-spacing:.01em}
.tb .sheetno{grid-column:9/13;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
.tb .sheetno b{font:800 34px/1 var(--display);color:var(--signal)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--ink)}
.seg button{flex:1;border:none;background:none;padding:5px 4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--sheet)}
.seg button.on.p{background:var(--warn);color:#fff}.seg button.on.d{background:var(--ok);color:#fff}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center;flex-shrink:0}
.ring::after{content:attr(data-l);width:42px;height:42px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font:500 12px var(--mono)}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 16px;font:700 13px var(--display);font-stretch:95%;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper)}
.tabs button small{font:500 11px var(--mono);margin-left:6px;opacity:.7}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:16px}
.panel h3{margin:0;font:800 15px var(--display);font-stretch:92%;text-transform:uppercase;letter-spacing:.05em}
.f label{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;padding:9px 10px;border:1px solid var(--rule);background:var(--paper)}
.f textarea{min-height:110px;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.drop{border:1.5px dashed var(--mute);padding:20px;text-align:center;color:var(--mute);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .tn{width:76px;height:76px;object-fit:cover;border:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{aspect-ratio:4/3;background:linear-gradient(100deg,var(--rule2) 30%,var(--paper) 50%,var(--rule2) 70%) 0 0/200% 100%;animation:sh 1.4s infinite linear;position:relative;border:1px solid var(--rule)}
.ph.ok{animation:none;background:var(--paper)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
@keyframes sh{to{background-position:-200% 0}}
.visit{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.visit .d{font:500 12px var(--mono);color:var(--mute)}.visit .d b{display:block;font:800 30px/1 var(--display);color:var(--ink)}
.visit p{margin:0 0 10px;white-space:pre-wrap}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2)}
.task input{width:18px;height:18px;accent-color:var(--ok)}
.task.done span{color:var(--mute);text-decoration:line-through}
.tag{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--rule);padding:2px 7px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{min-width:0}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:1px dashed var(--rule)}
.empty h3{color:var(--ink);margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips button{border:1px solid var(--rule);background:var(--sheet);padding:6px 12px;font-weight:500}.chips button:hover{border-color:var(--signal);color:var(--signal)}
/* joint */
.hero{background:var(--ink);color:var(--paper);padding:28px clamp(18px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero small{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.hero h1{margin:6px 0 4px;font:800 clamp(28px,5vw,50px)/1 var(--display);font-stretch:85%;text-transform:uppercase}
.hero p{margin:0;opacity:.75}
.big{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--signal) calc(var(--p)*1%),#ffffff2a 0);display:grid;place-items:center}
.big::after{content:attr(data-l);width:98px;height:98px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font:800 28px var(--display)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet)}
.stats div{padding:14px 16px;border-right:1px solid var(--rule)}
.stats b{display:block;font:800 30px/1 var(--display)}
.stats span{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
td{padding:10px;border-bottom:1px solid var(--rule2)}
tr.go{cursor:pointer}tr.go:hover td{background:var(--paper)}
.pill{font:500 10.5px var(--mono);text-transform:uppercase;padding:2px 8px;color:#fff;background:var(--mute)}
.pill.proceso{background:var(--warn)}.pill.terminado{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:500;z-index:30;max-width:90vw}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:40;padding:16px}
#lb.on{display:grid}#lb img{max-width:100%;max-height:100%}
.loading{display:grid;place-items:center;height:100%;color:var(--mute);gap:14px;text-align:center;padding:20px}
.spin{width:30px;height:30px;border:3px solid var(--rule);border-top-color:var(--signal);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:10px;align-items:stretch}
  .rail h6,.drive{display:none}.rail>*{flex-shrink:0;width:auto}.sh{min-width:150px}.add{margin:0}
  .week{margin-left:0}
  .tb .name{grid-column:1/-1}.tb .sheetno{grid-column:1/-1;align-items:flex-start;text-align:left}
  .c3,.c4,.c6{grid-column:span 6}
  .visit{grid-template-columns:1fr;gap:6px}.hero{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="app" id="app"><div class="loading" style="grid-column:1/-1"><div class="spin"></div><div>Conectando con tu Google Drive…</div></div></div>
<div id="lb" onclick="this.classList.remove('on')"><img id="lbi" alt=""></div>
<div id="toast" class="toast" hidden></div>

<script>
const SERVER='Google Drive', ROOT_NAME='Bitácora Remodelación', VISIT=[1,3,6];
const WD=['D','L','M','X','J','V','S'], WDN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const TAGS=['Demolición','Pisos','Muros','Pintura','Eléctrico','Hidráulico','Carpintería','Acabados','Otro'];
const STAT={pendiente:'Pendiente',proceso:'En proceso',terminado:'Terminado'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dparts=s=>{const d=new Date(s+'T12:00');return{d:d.getDate(),m:d.toLocaleDateString('es',{month:'short'}).replace('.',''),w:d.toLocaleDateString('es',{weekday:'long'}),y:d.getFullYear()}};

let S=null, mcp=null, F={}, view='joint', tab='registro', jtab='resumen', jgf='', sync={s:'off'}, fatal=null, draft={files:[]};

/* ---------- Drive ---------- */
async function drive(tool,input){
  const r=await mcp.callTool(SERVER,tool,input);
  let p=r.payload;
  if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
  return p;
}
const files=p=>Array.isArray(p)?p:(p&&p.files)||[];
async function findOrCreate(title,parent){
  const q=`title = '${title}' and mimeType = 'application/vnd.google-apps.folder' and owner = 'me'`+(parent?` and parentId = '${parent}'`:'');
  const f=files(await drive('search_files',{query:q,excludeContentSnippets:true}))[0];
  if(f)return f.id;
  const c=await drive('create_file',{title,mimeType:'application/vnd.google-apps.folder',...(parent?{parentId:parent}:{})});
  return c.id;
}
async function ensureFolders(){
  if(!F.root)F.root=await findOrCreate(ROOT_NAME);
  if(!F.state)F.state=await findOrCreate('_estado',F.root);
}
const b64utf8=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
async function loadState(){
  await ensureFolders();
  const list=files(await drive('search_files',{query:`parentId = '${F.state}' and title contains 'estado-'`,excludeContentSnippets:true,pageSize:50}))
    .filter(f=>/^estado-\d+\.json$/.test(f.title)).sort((a,b)=>b.title.localeCompare(a.title));
  if(!list.length)return{v:1,project:{name:'Remodelación segundo piso',address:'',owner:'',lead:'',start:today()},rooms:[]};
  const d=await drive('download_file_content',{fileId:list[0].id});
  return JSON.parse(b64utf8(d.content));
}
let saving=false,dirty=false,timer=null;
function touch(){dirty=true;setSync('saving');clearTimeout(timer);timer=setTimeout(persist,1200)}
async function persist(){
  if(saving)return;saving=true;dirty=false;
  try{
    await ensureFolders();
    await drive('create_file',{title:`estado-${String(Date.now()).padStart(13,'0')}.json`,parentId:F.state,contentMimeType:'application/json',disableConversionToGoogleType:true,textContent:JSON.stringify(S)});
    setSync(dirty?'saving':'ok',new Date());
    prune();
  }catch(e){setSync('err',e)}
  finally{saving=false;if(dirty)persist()}
}
async function prune(){
  try{
    const list=files(await drive('search_files',{query:`parentId = '${F.state}' and title contains 'estado-'`,excludeContentSnippets:true,pageSize:50}))
      .filter(f=>/^estado-\d+\.json$/.test(f.title)).sort((a,b)=>b.title.localeCompare(a.title));
    for(const f of list.slice(12))await drive('trash_file',{fileId:f.id});
  }catch(e){}
}
function setSync(s,x){
  sync={s,x};const el=$('#sync');if(!el)return;
  el.className='sync '+(s==='ok'?'':s);
  el.querySelector('span').textContent=s==='saving'?'Guardando en Drive…':s==='ok'?'Guardado en Drive '+(x?x.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):''):s==='err'?'Sin guardar · reintentar':'Sin conexión';
  if(s==='err'){el.onclick=()=>persist()}
}
function errText(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return['Tu conexión con Google Drive venció.','Reconéctala en Configuración → Conectores de claude.ai y recarga esta página.'];
  if(c==='server_not_connected'||c==='selection_required')return['Google Drive no está conectado.','Agrégalo en Configuración → Conectores de claude.ai y recarga esta página.'];
  if(c==='not_in_manifest')return['No permitiste el acceso a Google Drive.','Recarga la página y acepta el permiso para guardar tu bitácora.'];
  if(c==='blocked_by_policy'||c==='approval_required')return['Tu organización bloquea esta acción en Drive.','Pide al administrador que la habilite.'];
  return['No se pudo hablar con Google Drive.',(e&&e.message)||'Intenta de nuevo en unos segundos.'];
}

/* archivos: subida y lectura */
const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
function shrink(file,max=1400,q=.8){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b),'image/jpeg',q)};
    i.onerror=()=>{URL.revokeObjectURL(u);res(null)};i.src=u;
  });
}
async function roomFolder(r){
  if(r.folderId)return r.folderId;
  await ensureFolders();
  const n=S.rooms.indexOf(r)+1;
  r.folderId=await findOrCreate(`${pad(n)} ${r.name.replace(/'/g,'')}`,F.root);
  return r.folderId;
}
async function upload(r,title,blob,mime){
  const parentId=await roomFolder(r);
  let blobB64;
  if(blob.size>700000)throw{code:'bad_request',message:'El archivo supera 700 KB. Reduce su tamaño o súbelo como imagen.'};
  const c=await drive('create_file',{title,parentId,contentMimeType:mime,disableConversionToGoogleType:true,base64Content:await toB64(blob)});
  return c.id;
}
const cache=new Map();let active=0;const queue=[];
function pump(){while(active<3&&queue.length){const j=queue.shift();active++;j().finally(()=>{active--;pump()})}}
function fileURL(id){
  if(!cache.has(id))cache.set(id,new Promise((res,rej)=>{
    queue.push(()=>drive('download_file_content',{fileId:id}).then(d=>res(`data:${d.mimeType||'image/jpeg'};base64,${d.content}`),e=>{cache.delete(id);rej(e)}));pump();
  }));
  return cache.get(id);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target;
  fileURL(el.dataset.fid).then(u=>{el.classList.add('ok');el.innerHTML=`<img src="${u}" alt="">`}).catch(()=>{el.innerHTML='<div style="padding:10px;font-size:11px;color:var(--mute)">No se pudo cargar</div>'})}),{rootMargin:'200px'});
function lazy(){document.querySelectorAll('.ph[data-fid]:not(.ok)').forEach(el=>io.observe(el))}

const total=()=>S.rooms.length?Math.round(S.rooms.reduce((a,r)=>a+prog(r),0)/S.rooms.length):0;
const nPhotos=r=>r.visits.reduce((a,v)=>a+v.photos.length,0);
const room=()=>S.rooms.find(r=>r.id===view);
const mkRoom=name=>({id:uid(),name,level:'Nivel 2',area:'',scale:'1:50',ref:'',status:'pendiente',scope:'',materials:'',notes:'',folderId:null,plans:[],visits:[],tasks:[]});

/* Dashboard: avance */
function dashAvance(){
  if(!S.rooms.length)return emptyRooms();
  const c={pendiente:0,proceso:0,terminado:0};S.rooms.forEach(r=>c[r.status]++);
  const n=S.rooms.length,a=pct(c.terminado,n),b=a+pct(c.proceso,n);
  const sorted=[...S.rooms].sort((x,y)=>prog(y)-prog(x));
  return `<div class="dgrid"><div class="panel"><h3>Estado de los espacios</h3>
   <div class="row" style="align-items:center;gap:24px"><div class="donut" style="background:conic-gradient(var(--ok) 0 ${a}%,var(--warn) ${a}% ${b}%,var(--rule) ${b}% 100%)"><b>${c.terminado}/${n}</b></div>
   <div class="lg"><div><i style="background:var(--ok)"></i>Terminados · ${c.terminado}</div><div><i style="background:var(--warn)"></i>En proceso · ${c.proceso}</div><div><i style="background:var(--rule)"></i>Pendientes · ${c.pendiente}</div></div></div></div>
   <div class="panel"><h3>Avance por espacio</h3>${sorted.map(r=>`<div class="hb" data-act="go" data-id="${r.id}"><span>${esc(r.name)}</span><div class="bar big4"><i style="width:${prog(r)}%"></i></div><b>${prog(r)}%</b></div>`).join('')}</div></div>`;
}
/* Dashboard: visitas */
function dashVisitas(){
  if(!S.rooms.length)return emptyRooms();
  const set={};S.rooms.forEach(r=>r.visits.forEach(v=>{(set[v.date]=set[v.date]||new Set()).add(r.id)}));
  const now=new Date(today()+'T12:00'),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7)-49);
  let due=0,hit=0;const weeks=[];
  for(let w=0;w<8;w++){const col=[];for(const off of[0,2,5]){const d=new Date(mon);d.setDate(mon.getDate()+w*7+off);
    const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,k=set[s]?set[s].size:0,past=d<now&&s!==today(),isT=s===today();
    if(past||isT&&k){due++;if(k)hit++}
    col.push(`<div class="cell ${k?'hit':past?'miss':isT?'now':''}" title="${s}: ${k} espacios">${k||''}</div>`)}
    weeks.push(`<div class="wk"><small>${d.getDate()}/${d.getMonth()+1}</small>${col.join('')}</div>`)}
  const rows=S.rooms.map(r=>({r,l:lastVisit(r)})).sort((a,b)=>(a.l||'').localeCompare(b.l||''));
  return `<div class="dgrid"><div class="panel"><h3>Cumplimiento de visitas · últimas 8 semanas</h3>
   <div class="row" style="align-items:center;gap:20px"><div class="donut" style="background:conic-gradient(var(--ok) 0 ${pct(hit,due)}%,var(--rule) ${pct(hit,due)}% 100%)"><b>${pct(hit,due)}%</b></div><div class="lg"><div>${hit} de ${due} días de obra con registro</div><div style="color:var(--mute)">Lunes, miércoles y sábado</div></div></div>
   <div class="cal"><div class="wk lab"><small></small><div>Lun</div><div>Mié</div><div>Sáb</div></div>${weeks.join('')}</div></div>
   <div class="panel"><h3>Última visita por espacio</h3>${rows.map(({r,l})=>{const d=l?dayDiff(l):null;return`<div class="hb" data-act="go" data-id="${r.id}"><span>${esc(r.name)}</span><span style="font:12px var(--mono);color:${d===null||d>4?'var(--signal)':'var(--mute)'}">${d===null?'sin registros':d===0?'hoy':'hace '+d+' d'}</span><b></b></div>`}).join('')}</div></div>`;
}

  if(a==='gf'){jgf=id;return render()}
  if(a==='zoom'){const im=el.querySelector('img');if(im){$('#lbi').src=im.src;$('#lb').classList.add('on')}return}
  if(a==='tab'){tab=el.dataset.v;return render()}
  if(a==='status'){r.status=el.dataset.v;touch();return render()}
  if(a==='delroom'){if(el.dataset.c){S.rooms=S.rooms.filter(x=>x!==r);view='joint';touch();return render()}el.dataset.c=1;el.textContent='Confirmar: se quita del proyecto (los archivos quedan en Drive)';return}
  if(a==='addtask'){const t=$('#tt').value.trim();if(!t)return;r.tasks.push({id:uid(),text:t,tag:$('#tg').value,done:false});touch();return render()}
  if(a==='tog'){const t=r.tasks.find(x=>x.id===id);t.done=el.checked;if(r.tasks.every(x=>x.done))r.status='terminado';else if(r.status==='pendiente')r.status='proceso';else if(r.status==='terminado')r.status='proceso';touch();return render()}
  if(a==='deltask'){r.tasks=r.tasks.filter(x=>x.id!==id);touch();return render()}
  if(a==='delplan'){r.plans=r.plans.filter(x=>x.id!==id);touch();return render()}
  if(a==='delvisit'){r.visits=r.visits.filter(x=>x.id!==id);touch();return render()}
  if(a==='savevisit')return saveVisit(el);
  if(a==='report')return report(el);
});
document.addEventListener('change',ev=>{
  const t=ev.target;if(!S)return;
  if(t.dataset.pf){S.project[t.dataset.pf]=t.value;touch();if(t.dataset.pf==='name')render();return}
  if(t.dataset.rf){const r=room();r[t.dataset.rf]=t.value;touch();if(t.dataset.rf==='name')render();return}
  if(t.id==='vd')draft.date=t.value;
  if(t.id==='vn')draft.note=t.value;
  if(t.id==='vf')addDraft(t.files);
  if(t.id==='pf')addPlans(t.files);
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='addf')return;ev.preventDefault();
  const n=$('#newname').value.trim();if(n)addRoom(n);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')$('#lb').classList.remove('on');
  if(ev.key==='Enter'&&ev.target.id==='tt')document.querySelector('[data-act=addtask]')?.click();
});
document.addEventListener('input',ev=>{if(ev.target.id==='vn')draft.note=ev.target.value});
['dragover','drop'].forEach(n=>document.addEventListener(n,ev=>{
  const z=ev.target.closest('#drop,#pdrop');if(!z)return;ev.preventDefault();
  z.classList.toggle('over',n==='dragover');
  if(n==='drop')z.id==='drop'?addDraft(ev.dataTransfer.files):addPlans(ev.dataTransfer.files);
}));

async function addDraft(fl){
  for(const f of fl){const b=await shrink(f);if(b)draft.files.push({blob:b,url:URL.createObjectURL(b)})}
  const keep={d:$('#vd')?.value,n:$('#vn')?.value};draft.date=keep.d;draft.note=keep.n;render();
}
async function saveVisit(btn){
  const r=room(),note=($('#vn').value||'').trim(),date=$('#vd').value||today();
  if(!note&&!draft.files.length)return toast('Escribe una observación o agrega fotos.');
  btn.disabled=true;const photos=[];
  try{
    let k=0;
    for(const f of draft.files){btn.textContent=`Subiendo foto ${++k} de ${draft.files.length}…`;
      const name=`${date}_${pad(k)}_${uid().slice(0,4)}.jpg`;photos.push({id:await upload(r,name,f.blob,'image/jpeg'),name})}
    r.visits.push({id:uid(),date,note,photos});if(r.status==='pendiente')r.status='proceso';
    draft={files:[]};touch();toast('Visita guardada en Drive');render();
  }catch(e){fail(e);btn.disabled=false;btn.textContent='Guardar visita en Drive'}
}
async function addPlans(fl){
  const r=room();
  try{for(const f of fl){
    const isImg=f.type.startsWith('image/');const b=isImg?await shrink(f,2400,.85):f;
    const id=await upload(r,'PLANO · '+f.name,b,isImg?'image/jpeg':f.type);
    r.plans.push({id,name:f.name,mime:isImg?'image/jpeg':f.type});}
    touch();toast('Planos guardados en Drive');render()}
  catch(e){fail(e)}
}

/* informe final (Google Doc) */
async function thumb(id){
  const u=await fileURL(id);
  return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res('');i.src=u});
}
async function report(btn){
  btn.disabled=true;const p=S.project;
  try{
    let h=`<h1>${esc(p.name)}</h1><p>${esc(p.address)}</p><p><b>Propietario:</b> ${esc(p.owner)||'—'}<br><b>Responsable técnico:</b> ${esc(p.lead)||'—'}</p><p><b>Avance general:</b> ${total()}%<br><b>Emitido:</b> ${today()}</p>
    <h2>Índice de láminas</h2><table border="1" cellpadding="5"><tr><th>Lámina</th><th>Espacio</th><th>Estado</th><th>Avance</th><th>Registros</th><th>Fotos</th></tr>${S.rooms.map((r,i)=>`<tr><td>L-${pad(i+1)}</td><td>${esc(r.name)}</td><td>${STAT[r.status]}</td><td>${prog(r)}%</td><td>${r.visits.length}</td><td>${nPhotos(r)}</td></tr>`).join('')}</table>`;
    for(const[i,r]of S.rooms.entries()){
      btn.textContent=`Armando lámina ${i+1} de ${S.rooms.length}…`;
      h+=`<br style="page-break-before:always"><h1>L-${pad(i+1)} · ${esc(r.name)}</h1><table border="1" cellpadding="5"><tr><td><b>Nivel</b></td><td>${esc(r.level)}</td><td><b>Área</b></td><td>${esc(r.area)} m²</td></tr><tr><td><b>Escala</b></td><td>${esc(r.scale)}</td><td><b>Ref. plano</b></td><td>${esc(r.ref)}</td></tr><tr><td><b>Estado</b></td><td>${STAT[r.status]}</td><td><b>Avance</b></td><td>${prog(r)}%</td></tr></table>
      ${r.scope?`<h3>Alcance</h3><p>${esc(r.scope).replace(/\n/g,'<br>')}</p>`:''}${r.materials?`<h3>Materiales y medidas</h3><p>${esc(r.materials).replace(/\n/g,'<br>')}</p>`:''}
      ${r.tasks.length?`<h3>Partidas</h3><ul>${r.tasks.map(t=>`<li>${t.done?'☑':'☐'} ${esc(t.text)} (${esc(t.tag)})</li>`).join('')}</ul>`:''}
      <h3>Registro de obra</h3>`;
      for(const v of [...r.visits].sort((a,b)=>a.date.localeCompare(b.date))){
        h+=`<p><b>${v.date}</b> — ${esc(v.note)}</p>`;
        for(const f of v.photos.slice(0,8)){const t=await thumb(f.id).catch(()=>'');if(t)h+=`<img src="${t}" width="260"> `}
      }
    }
    btn.textContent='Subiendo informe…';
    const html=`<html><body>${h}</body></html>`;
    const c=await drive('create_file',{title:`Informe de obra · ${p.name} · ${today()}`,parentId:F.root,contentMimeType:'text/html',textContent:html});
    toast('Informe creado en tu Drive');
    btn.outerHTML=`<a class="btn sig" href="${esc(c.viewUrl||'https://drive.google.com/drive/folders/'+F.root)}" target="_blank" rel="noopener">Abrir informe ↗</a>`;
  }catch(e){fail(e);btn.disabled=false;btn.textContent='Generar informe final en Drive'}
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    mcp=await window.claude?.use('mcp');
    if(!mcp){fatal={code:'server_not_connected'};return render()}
    S=await loadState();
    try{const v=localStorage.getItem('bo-view');if(v&&S.rooms.some(r=>r.id===v))view=v}catch(e){}
    sync={s:'ok',x:null};render();
  }catch(e){fatal=e;render()}
})();
</script>
