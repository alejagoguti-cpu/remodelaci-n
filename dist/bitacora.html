<title>Bitácora de Obra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Tema: panel de control claro, barra lateral, tarjetas con borde suave, azul y coral */
:root{
  --paper:#f6f7fb; --sheet:#ffffff; --ink:#1b2437; --mute:#6b7487; --rule:#e4e7ee; --rule2:#eef0f5;
  --blue:#2f5be7; --blue-soft:#e9efff; --signal:#ff7a45; --signal-soft:#fff0e9; --ok:#1fa971; --warn:#f2a31b; --bad:#e5484d;
  --display:'Plus Jakarta Sans',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'Plus Jakarta Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1420; --sheet:#171d2c; --ink:#eaeefb; --mute:#8d97ad; --rule:#273049; --rule2:#1f2740;
  --blue:#6f93ff; --blue-soft:#1c2848; --signal:#ff8a5b; --signal-soft:#35241d; --ok:#38c68b; --warn:#f0b13c; --bad:#ff6b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1420; --sheet:#171d2c; --ink:#eaeefb; --mute:#8d97ad; --rule:#273049; --rule2:#1f2740;
  --blue:#6f93ff; --blue-soft:#1c2848; --signal:#ff8a5b; --signal-soft:#35241d; --ok:#38c68b; --warn:#f0b13c; --bad:#ff6b70; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.brand{font:800 18px/1 var(--display);font-stretch:90%;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px;min-width:0}
.brand i{width:10px;height:10px;background:var(--signal);display:inline-block}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:flex;gap:4px;margin-left:auto}
.week b{font:500 11px var(--mono);width:30px;height:26px;display:grid;place-items:center;border:1px solid #ffffff33;color:#ffffff88}
.week b.v{color:var(--paper);border-color:#ffffffaa}
.week b.t{background:var(--signal);border-color:var(--signal);color:#fff}
.sync{font:500 11px var(--mono);display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid #ffffff33;border-radius:99px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7bd8a6}
.sync.saving i{background:#f0b84a;animation:pulse 1s infinite}.sync.err i{background:#ff7b72}.sync.off i{background:#888}
@keyframes pulse{50%{opacity:.3}}
/* rail */
.rail{background:var(--sheet);border-right:1px solid var(--rule);overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.rail h6{margin:10px 6px 4px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.joint{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid var(--blue);background:var(--blue-soft);color:var(--blue);font:700 14px var(--display);font-stretch:95%;letter-spacing:.03em;text-transform:uppercase;text-align:left}
.joint.sel{background:var(--blue);color:var(--sheet)}
.sh{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;background:none;border-bottom:1px solid var(--rule2)}
.sh:hover{background:var(--paper)}
.sh.sel{background:var(--signal-soft);border-color:var(--signal)}
.sh .n{font:500 11px var(--mono);color:var(--mute);grid-row:span 2;align-self:center}
.sh .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .m{display:flex;align-items:center;gap:8px;font:400 11px var(--mono);color:var(--mute)}
.bar{flex:1;height:4px;background:var(--rule);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.add{margin-top:6px;border:1px dashed var(--mute);background:none;padding:9px;color:var(--mute);font-weight:500}
.add:hover{color:var(--signal);border-color:var(--signal)}
.addf input{width:100%;margin-top:6px;border:1px dashed var(--mute);background:none;padding:9px 10px;font-weight:500}
.addf input:focus{border-color:var(--signal);outline:none;background:var(--sheet)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.donut{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative}
.donut::before{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--sheet)}
.donut b{position:relative;font:800 22px var(--display)}
.lg{display:flex;flex-direction:column;gap:6px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;margin-right:8px}
.hb{display:grid;grid-template-columns:minmax(80px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule2)}
.hb[data-act]{cursor:pointer}.hb[data-act]:hover{background:var(--paper)}
.hb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.hb b{font:500 12px var(--mono);min-width:38px;text-align:right}
.bar.big4{height:10px}
.cal{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wk{display:flex;flex-direction:column;gap:6px;align-items:center}.wk small{font:10px var(--mono);color:var(--mute)}
.wk.lab div{height:34px;display:grid;align-items:center;font:500 11px var(--mono);color:var(--mute);padding-right:6px}
.cell{width:38px;height:34px;display:grid;place-items:center;font:500 12px var(--mono);border:1px solid var(--rule);color:var(--mute)}
.cell.hit{background:var(--ok);border-color:var(--ok);color:#fff}.cell.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}.cell.now{border:2px solid var(--signal)}
.drive{margin-top:auto;padding:10px 6px 0;font-size:12px;color:var(--mute)}
.drive a{color:var(--blue);font-weight:600}
/* main */
.main{overflow:auto;padding:22px clamp(16px,3vw,36px) 60px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.banner{padding:12px 14px;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--sheet));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:600}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.alt{background:none;color:var(--ink);border-color:var(--rule)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:none;color:var(--mute);padding:2px 6px}.ghost:hover{color:var(--bad)}
/* title block */
.tb{background:var(--sheet);border:2px solid var(--ink);display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.tb>div{padding:8px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.tb label{display:block;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.tb input{width:100%;border:none;background:none;padding:2px 0;font-weight:600;font-size:14px;border-bottom:1px dashed transparent}
.tb input:hover,.tb input:focus{border-bottom-color:var(--signal);outline:none}
.tb .name{grid-column:1/9;padding:16px 16px 14px}
.tb .name input{font:800 clamp(26px,4vw,40px)/1.05 var(--display);font-stretch:88%;text-transform:uppercase;letter-spacing:.01em}
.tb .sheetno{grid-column:9/13;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
.tb .sheetno b{font:800 34px/1 var(--display);color:var(--signal)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--ink)}
.seg button{flex:1;border:none;background:none;padding:5px 4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.seg button+button{border-left:1px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--sheet)}
.seg button.on.p{background:var(--warn);color:#fff}.seg button.on.d{background:var(--ok);color:#fff}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center;flex-shrink:0}
.ring::after{content:attr(data-l);width:42px;height:42px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font:500 12px var(--mono)}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 16px;font:700 13px var(--display);font-stretch:95%;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper)}
.tabs button small{font:500 11px var(--mono);margin-left:6px;opacity:.7}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:16px}
.panel h3{margin:0;font:800 15px var(--display);font-stretch:92%;text-transform:uppercase;letter-spacing:.05em}
.f label{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;padding:9px 10px;border:1px solid var(--rule);background:var(--paper)}
.f textarea{min-height:110px;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.drop{border:1.5px dashed var(--mute);padding:20px;text-align:center;color:var(--mute);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .tn{width:76px;height:76px;object-fit:cover;border:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{aspect-ratio:4/3;background:linear-gradient(100deg,var(--rule2) 30%,var(--paper) 50%,var(--rule2) 70%) 0 0/200% 100%;animation:sh 1.4s infinite linear;position:relative;border:1px solid var(--rule)}
.ph.ok{animation:none;background:var(--paper)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
@keyframes sh{to{background-position:-200% 0}}
.visit{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.visit .d{font:500 12px var(--mono);color:var(--mute)}.visit .d b{display:block;font:800 30px/1 var(--display);color:var(--ink)}
.visit p{margin:0 0 10px;white-space:pre-wrap}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2)}
.task input{width:18px;height:18px;accent-color:var(--ok)}
.task.done span{color:var(--mute);text-decoration:line-through}
.tag{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--rule);padding:2px 7px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{min-width:0}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:1px dashed var(--rule)}
.empty h3{color:var(--ink);margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips button{border:1px solid var(--rule);background:var(--sheet);padding:6px 12px;font-weight:500}.chips button:hover{border-color:var(--signal);color:var(--signal)}
/* joint */
.hero{background:var(--ink);color:var(--paper);padding:28px clamp(18px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero small{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.hero h1{margin:6px 0 4px;font:800 clamp(28px,5vw,50px)/1 var(--display);font-stretch:85%;text-transform:uppercase}
.hero p{margin:0;opacity:.75}
.big{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--signal) calc(var(--p)*1%),#ffffff2a 0);display:grid;place-items:center}
.big::after{content:attr(data-l);width:98px;height:98px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font:800 28px var(--display)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet)}
.stats div{padding:14px 16px;border-right:1px solid var(--rule)}
.stats b{display:block;font:800 30px/1 var(--display)}
.stats span{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
td{padding:10px;border-bottom:1px solid var(--rule2)}
tr.go{cursor:pointer}tr.go:hover td{background:var(--paper)}
.pill{font:500 10.5px var(--mono);text-transform:uppercase;padding:2px 8px;color:#fff;background:var(--mute)}
.pill.proceso{background:var(--warn)}.pill.terminado{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:500;z-index:30;max-width:90vw}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:40;padding:16px}
#lb.on{display:grid}#lb img{max-width:100%;max-height:100%}
.loading{display:grid;place-items:center;height:100%;color:var(--mute);gap:14px;text-align:center;padding:20px}
.spin{width:30px;height:30px;border:3px solid var(--rule);border-top-color:var(--signal);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:10px;align-items:stretch}
  .rail h6,.drive{display:none}.rail>*{flex-shrink:0;width:auto}.sh{min-width:150px}.add{margin:0}
  .week{margin-left:0}
  .tb .name{grid-column:1/-1}.tb .sheetno{grid-column:1/-1;align-items:flex-start;text-align:left}
  .c3,.c4,.c6{grid-column:span 6}
  .visit{grid-template-columns:1fr;gap:6px}.hero{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* MEP y acabados */
.stk{display:flex;height:14px;background:var(--rule2);min-width:0}.stk i{display:block;height:100%}
.hb2{display:grid;grid-template-columns:minmax(90px,.9fr) 2fr 34px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule2)}
.hb2 b{font:500 12px var(--mono);text-align:right}
.item{border-top:1px solid var(--rule);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.item.done .it-h b{color:var(--mute);text-decoration:line-through}
.it-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.it-h b{font-weight:600}
.it-h input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.it-s{font-size:12.5px;color:var(--mute)}
select.mini{border:1px solid var(--rule);background:var(--paper);padding:4px 8px;font:500 12px var(--mono);margin-left:auto}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.addph{aspect-ratio:4/3;border:1.5px dashed var(--mute);display:grid;place-items:center;color:var(--mute);font:500 12px var(--mono);cursor:pointer}
.addph:hover{border-color:var(--signal);color:var(--signal)}.addph input{display:none}
.tag.sev-alta{color:var(--bad);border-color:var(--bad)}.tag.sev-media{color:var(--warn);border-color:var(--warn)}.tag.sev-baja{color:var(--mute)}
table.mx td,table.mx th{text-align:center;padding:8px 6px}table.mx td:first-child,table.mx th:first-child{text-align:left}
table.mx td.z{color:var(--rule)}
/* PPC */
.ppc{display:flex;gap:10px;align-items:flex-end;height:150px}
.pcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;position:relative;min-width:0}
.pcol i{display:block;width:100%;background:var(--blue);min-height:2px}.pcol b{font:500 11px var(--mono)}.pcol small{font:10px var(--mono);color:var(--mute)}
.tabs{flex-wrap:nowrap}

/* ===== Tema panel de control (sobrescribe estilos anteriores) ===== */
body{font:14px/1.5 var(--body);font-variant-numeric:tabular-nums}
.app{display:block;height:100%}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;padding:18px 14px 12px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo .mark{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center}
.logo b{display:block;font:800 17px/1.1 var(--display)}.logo small{color:var(--mute);font-size:12px}
.navs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
.navs h6{margin:16px 10px 4px;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;border-radius:10px;padding:9px 12px;text-align:left;font-weight:600;color:var(--ink);font-size:14px}
.nv svg{color:var(--mute);flex-shrink:0}
.nv:hover{background:var(--paper)}
.nv.on{background:var(--blue-soft);color:var(--blue)}.nv.on svg{color:var(--blue)}
.nv.rm{padding:8px 12px;font-weight:500;gap:10px}
.nv.rm em{font:600 11px var(--body);color:var(--mute);font-style:normal;min-width:30px}
.nv.rm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex-shrink:0}.dot.proceso{background:var(--warn)}.dot.terminado{background:var(--ok)}
.addf input{margin-top:8px;border-radius:10px;border:1px dashed var(--rule);padding:9px 12px;background:none;width:100%}
.addf input:focus{border-color:var(--blue);outline:none;background:var(--paper)}
.side-foot{border-top:1px solid var(--rule);padding:12px 10px 0;font-size:12.5px;color:var(--mute);line-height:1.5}
.side-foot a{color:var(--blue);font-weight:600}.side-foot b{color:var(--ink)}
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,32px);background:var(--sheet);border-bottom:1px solid var(--rule)}
.search{position:relative;flex:1;max-width:560px;display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:11px;padding:0 14px;background:var(--sheet);color:var(--mute)}
.search input{flex:1;min-width:0;border:none;background:none;padding:11px 0;font-size:13.5px;outline:none;color:var(--ink)}
.search:focus-within{border-color:var(--blue)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 32px #1b24371f;padding:6px;display:flex;flex-direction:column}
.sres[hidden]{display:none}
.sres button{display:flex;gap:10px;align-items:baseline;border:none;background:none;text-align:left;padding:8px 10px;border-radius:8px}
.sres button:hover{background:var(--paper)}.sres b{font-size:11px;color:var(--blue);min-width:78px;text-transform:uppercase;letter-spacing:.04em}
.sres span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sres .none{padding:10px;color:var(--mute)}
.week{display:flex;gap:4px;margin-left:auto}
.week b{font:600 11px var(--body);width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--rule);color:var(--mute);background:none}
.week b.v{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}.week b.t{background:var(--signal);border-color:var(--signal);color:#fff}
.sync{font:600 12px var(--body);border:1px solid var(--rule);color:var(--ink);background:var(--sheet);border-radius:99px;padding:6px 12px}

<script>
/*
 * Almacenamiento alterno para cuando la app se abre fuera de claude.ai (por ejemplo en GitHub Pages).
 * Ambos adaptadores exponen la misma interfaz que el conector de Google Drive de claude.ai:
 *   callTool(servidor, herramienta, entrada) -> { payload }
 * así el resto de la app no cambia.
 *  - Local: guarda en IndexedDB de este navegador.
 *  - Google: usa la API REST de Google Drive con un token OAuth (scope drive.file).
 *    Requiere un ID de cliente de OAuth en config.js (ver README).
 */
let BACKEND='claude';
const BO_CONFIG=(typeof window!=='undefined'&&window.BO_CONFIG)||{};

function makeLocalMcp(){
  const open=()=>new Promise((res,rej)=>{const q=indexedDB.open('bitacora-local',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  const dbp=open();
  const tx=async(mode,fn)=>{const db=await dbp;return new Promise((res,rej)=>{const t=db.transaction('files',mode),s=t.objectStore('files'),r=fn(s);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
  const all=()=>tx('readonly',s=>s.getAll());
  const meta=f=>({id:f.id,title:f.title,mimeType:f.mimeType,parentId:f.parentId,viewUrl:''});
  return{callTool:async(srv,tool,i)=>{
    let p;
    if(tool==='search_files'){
      const q=i.query,t=(q.match(/title = '([^']*)'/)||[])[1],c=(q.match(/title contains '([^']*)'/)||[])[1],par=(q.match(/parentId = '([^']*)'/)||[])[1],fo=/folder/.test(q);
      p={files:(await all()).filter(f=>!f.trashed&&(!t||f.title===t)&&(!c||f.title.includes(c))&&(!par||f.parentId===par)&&(!fo||f.mimeType.includes('folder'))).map(meta)};
    }else if(tool==='create_file'){
      const f={id:'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:i.title,mimeType:i.mimeType||i.contentMimeType,parentId:i.parentId,text:i.textContent,b64:i.base64Content};
      await tx('readwrite',s=>s.put(f));p=meta(f);
    }else if(tool==='download_file_content'){
      const f=(await all()).find(x=>x.id===i.fileId);
      p={content:f.b64||btoa(unescape(encodeURIComponent(f.text||''))),mimeType:f.mimeType,id:f.id,title:f.title};
    }else if(tool==='trash_file'){
      await tx('readwrite',s=>s.delete(i.fileId));p={};
    }
    return{payload:p};
  }};
}

function makeGoogleMcp(token){
  const API='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files',FIELDS='id,name,mimeType,webViewLink,parents';
  const auth={Authorization:'Bearer '+token};
  const fail=async r=>{const m=await r.text().catch(()=>'');throw{code:r.status===401?'needs_reauth':r.status===403?'blocked_by_policy':'upstream_error',message:`Google Drive respondió ${r.status}. ${m.slice(0,160)}`}};
  const meta=f=>({id:f.id,title:f.name,mimeType:f.mimeType,parentId:(f.parents||[])[0],viewUrl:f.webViewLink||''});
  const toQ=q=>q.replace(/title contains/g,'name contains').replace(/title =/g,'name =').replace(/parentId = '([^']*)'/g,"'$1' in parents").replace(/owner = 'me'/g,"'me' in owners")+' and trashed = false';
  const b64blob=(b,type)=>{const a=atob(b),u=new Uint8Array(a.length);for(let k=0;k<a.length;k++)u[k]=a.charCodeAt(k);return new Blob([u],{type})};
  return{callTool:async(srv,tool,i)=>{
    let p;
    if(tool==='search_files'){
      const r=await fetch(`${API}?q=${encodeURIComponent(toQ(i.query))}&fields=files(${FIELDS})&pageSize=${i.pageSize||50}`,{headers:auth});if(!r.ok)await fail(r);
      p={files:((await r.json()).files||[]).map(meta)};
    }else if(tool==='create_file'){
      const isFolder=(i.mimeType||'').includes('folder');
      const md={name:i.title,...(i.parentId?{parents:[i.parentId]}:{})};
      if(isFolder){
        const r=await fetch(`${API}?fields=${FIELDS}`,{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({...md,mimeType:'application/vnd.google-apps.folder'})});if(!r.ok)await fail(r);p=meta(await r.json());
      }else{
        const media=i.base64Content?b64blob(i.base64Content,i.contentMimeType):new Blob([i.textContent||''],{type:i.contentMimeType});
        if(i.contentMimeType==='text/html'&&!i.disableConversionToGoogleType)md.mimeType='application/vnd.google-apps.document'; else md.mimeType=i.contentMimeType;
        const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(md)],{type:'application/json'}));fd.append('file',media);
        const r=await fetch(`${UP}?uploadType=multipart&fields=${FIELDS}`,{method:'POST',headers:auth,body:fd});if(!r.ok)await fail(r);p=meta(await r.json());
      }
    }else if(tool==='download_file_content'){
      const r=await fetch(`${API}/${i.fileId}?alt=media`,{headers:auth});if(!r.ok)await fail(r);
      const buf=new Uint8Array(await r.arrayBuffer());let s='';for(let k=0;k<buf.length;k+=8192)s+=String.fromCharCode.apply(null,buf.subarray(k,k+8192));
      p={content:btoa(s),mimeType:r.headers.get('Content-Type')||'application/octet-stream',id:i.fileId};
    }else if(tool==='trash_file'){
      const r=await fetch(`${API}/${i.fileId}`,{method:'PATCH',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});if(!r.ok)await fail(r);p={};
    }
    return{payload:p};
  }};
}

function googleToken(clientId){
  return new Promise((res,rej)=>{
    const go=()=>google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.file',
      callback:t=>t.access_token?res(t.access_token):rej({code:'needs_reauth',message:t.error||'Sin permiso de Google Drive.'}),
      error_callback:e=>rej({code:'needs_reauth',message:e.type||'Se canceló el acceso a Google Drive.'})}).requestAccessToken();
    if(window.google&&google.accounts)return go();
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;s.onerror=()=>rej({code:'server_unavailable',message:'No se pudo cargar el acceso de Google.'});document.head.appendChild(s);
  });
}

/* Pantalla de inicio fuera de claude.ai */
function chooseBackend(){
  return new Promise(resolve=>{
    try{if(localStorage.getItem('bo-backend')==='local'){BACKEND='local';return resolve(makeLocalMcp())}}catch(e){}
    const g=BO_CONFIG.googleClientId;
    document.getElementById('app').innerHTML=`<div class="loading" style="grid-column:1/-1"><div style="max-width:520px">
      <div class="brand" style="color:var(--ink);justify-content:center;margin-bottom:14px"><i></i><span>Bitácora de Obra</span></div>
      <p style="margin:0 0 18px">Elige dónde guardar la información del proyecto.</p>
      <div class="row" style="justify-content:center">
       ${g?`<button class="btn sig" id="bg">Conectar Google Drive</button>`:`<button class="btn alt" disabled title="Falta configurar el ID de cliente de Google en config.js">Google Drive (sin configurar)</button>`}
       <button class="btn" id="bl">Usar en este navegador</button></div>
      <p style="font-size:12.5px;color:var(--mute);margin-top:16px">${g?'Con Google Drive, las fotos y los datos quedan en tu carpeta <b>Bitácora Remodelación</b>.':'Para guardar en Google Drive desde este sitio hay que poner un ID de cliente de Google en <code>config.js</code> (pasos en el README). También funciona abriéndola desde claude.ai.'} El modo local guarda solo en este navegador y este equipo.</p></div></div>`;
    document.getElementById('bl').onclick=()=>{try{localStorage.setItem('bo-backend','local')}catch(e){}BACKEND='local';resolve(makeLocalMcp())};
    const bg=document.getElementById('bg');
    if(bg)bg.onclick=async()=>{bg.disabled=true;bg.textContent='Esperando permiso…';
      try{BACKEND='google';resolve(makeGoogleMcp(await googleToken(g)))}
      catch(e){bg.disabled=false;bg.textContent='Conectar Google Drive';document.getElementById('toast').textContent=e.message||'No se pudo conectar.';document.getElementById('toast').hidden=false}};
  });
}

/* ====== 1. ENTREGA DE SISTEMAS ======
   Cada red se prueba en dos etapas (antes de energizar o presurizar, y en operación)
   y solo se entrega cuando no queda nada pendiente ni fallido y no hay incidencias graves abiertas. */
const SYS_TYPES=['Eléctrica','Hidráulica','Sanitaria','Gas','Datos y CCTV','HVAC'];
const PROTOCOLO={
 'Eléctrica':{previa:['Tablero con circuitos rotulados y planilla de cargas al día','Conductores del calibre de planos y bornes bien ajustados','Aislamiento de cada circuito medido antes de energizar','Tierra conectada a la barra y a cada tomacorriente'],

 'Hidráulica':{previa:['Tubería presurizada sin caída de presión durante la prueba','Soportes y pendientes según plano, sin tramos colgantes','Llaves de paso instaladas y rotuladas por zona','Red lavada antes de conectar los aparatos'],

 'Sanitaria':{previa:['Pendiente continua en todos los tramos horizontales','Registros accesibles y libres de escombro','Ventilación conectada y sin obstrucciones'],
  operacion:['Prueba de llenado sin pérdida de nivel','Evacuación rápida, sin gorgoteo ni retorno','Los sifones conservan su sello de agua','Sin humedad ni olores tras uso repetido']},
 'Gas':{previa:['Tubería y accesorios homologados, con soportes adecuados','Prueba de hermeticidad aprobada y registrada','Ventilación permanente del recinto verificada'],
  operacion:['Sin fugas comprobado con detector o espuma','Válvula de corte y regulador funcionan','Llama azul y estable en cada artefacto']},
 'Datos y CCTV':{previa:['Cables rotulados en ambos extremos','Canalización separada de la de potencia','Salidas terminadas en el conector definido'],

const SYS_ST={sin_iniciar:'Sin iniciar',en_pruebas:'En pruebas',listo:'Listo para entregar',entregado:'Entregado'};
const RES=[['pendiente','Pendiente'],['ok','Cumple'],['falla','Falla'],['na','No aplica']];
const SEV_INC=[['baja','Baja'],['media','Media'],['alta','Alta']];
function estadoSistema(s){
  const ap=s.tests.filter(t=>t.res!=='na'),ok=ap.filter(t=>t.res==='ok').length;
  const pend=ap.filter(t=>t.res==='pendiente').length,fall=ap.filter(t=>t.res==='falla').length;
  const graves=s.inc.filter(i=>i.abierta&&i.sev==='alta').length;
  const op=ap.filter(t=>t.etapa==='operacion'),pr=ap.filter(t=>t.etapa==='previa');
  const f=a=>a.length?a.filter(t=>t.res==='ok').length/a.length:1;
  const avance=ap.length?Math.round((f(pr)*.4+f(op)*.6)*100):0;
  const motivos=[];
  if(!ap.length)motivos.push('El sistema no tiene pruebas aplicables.');
  if(pend)motivos.push(`${pend} prueba(s) pendiente(s).`);
  if(fall)motivos.push(`${fall} prueba(s) con falla.`);
  if(graves)motivos.push(`${graves} incidencia(s) grave(s) abierta(s).`);
  return{avance,ok,total:ap.length,motivos,puede:motivos.length===0,nivel:(fall||graves)?'red':motivos.length?'amber':'green'};
}
function recalcular(s){
  if(s.estado==='entregado')return;
  const hecho=s.tests.some(t=>t.res!=='pendiente');
  s.estado=!hecho?'sin_iniciar':estadoSistema(s).puede?'listo':'en_pruebas';
}
EXT.views.cx=function(){
  const L=S.cx;
  const stats=`<div class="stats"><div><b>${L.length}</b><span>Sistemas</span></div><div><b>${L.filter(s=>s.estado==='entregado').length}</b><span>Entregados</span></div><div><b>${L.filter(s=>estadoSistema(s).nivel==='red').length}</b><span>Con bloqueo</span></div><div><b>${L.reduce((a,s)=>a+s.inc.filter(i=>i.abierta).length,0)}</b><span>Incidencias abiertas</span></div></div>`;
  const form=`<div class="panel"><h3>Nuevo sistema</h3><div class="row f">${field('Disciplina',sel('sy_t',SYS_TYPES,'Eléctrica'),150)}${field('Nombre',`<input id="sy_n" placeholder="Ej. Tablero TD-2, segundo piso">`)}${field('Tag',`<input id="sy_g" placeholder="TD-2">`,110)}${field('Ubicación',`<input id="sy_l" placeholder="Pasillo, muro norte">`)}<button class="btn" data-act="syadd">Crear con su protocolo</button></div>
   <small style="color:var(--mute)">Cada sistema trae pruebas previas (antes de energizar o presurizar) y pruebas en operación. Se entrega cuando todas cumplen y no quedan incidencias graves.</small></div>`;
  const etiqueta=t=>`<label style="font:700 11px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)">${t}</label>`;
  const cards=L.map(s=>{const e=estadoSistema(s);return`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><div><h3>${esc(s.name)}</h3><small style="color:var(--mute)">${esc(s.tipo)}${s.tag?' · '+esc(s.tag):''}${s.loc?' · '+esc(s.loc):''}</small></div>
    <div class="row" style="align-items:center"><span class="pill ${e.nivel==='green'?'terminado':e.nivel==='amber'?'proceso':''}" ${e.nivel==='red'?'style="background:var(--bad)"':''}>${SYS_ST[s.estado]}</span><div class="ring" style="--p:${e.avance}" data-l="${e.avance}"></div></div></div>
    ${[['previa','Pruebas previas'],['operacion','Pruebas en operación']].map(([k,t])=>`<div>${etiqueta(t)}${s.tests.filter(x=>x.etapa===k).map(x=>`<div class="item" style="padding:7px 0"><div class="it-h"><span style="flex:1;min-width:200px">${esc(x.txt)}</span><select class="mini" data-syt="${s.id}|${x.id}">${opts(RES,x.res)}</select></div></div>`).join('')}</div>`).join('')}
    <div>${etiqueta('Incidencias')}
     ${s.inc.map(i=>`<div class="item ${i.abierta?'':'done'}" style="padding:7px 0"><div class="it-h"><b style="flex:1;min-width:200px">${esc(i.txt)}</b><span class="tag sev-${i.sev==='alta'?'alta':i.sev==='media'?'media':'baja'}">${SEV_INC.find(x=>x[0]===i.sev)[1]}</span><button class="btn alt sm" data-act="syinc" data-id="${s.id}|${i.id}">${i.abierta?'Resolver':'Reabrir'}</button></div></div>`).join('')||'<div class="it-s">Sin incidencias.</div>'}
     <div class="row f" style="margin-top:6px">${field('Nueva incidencia',`<input id="sy_i-${s.id}" placeholder="Qué falló o falta">`)}${field('Gravedad',`<select id="sy_s-${s.id}">${opts(SEV_INC,'media')}</select>`,130)}<button class="btn alt sm" data-act="syaddinc" data-id="${s.id}">Añadir</button></div></div>
    <div class="row" style="align-items:center">${s.estado==='entregado'?`<span style="color:var(--ok);font-weight:600">Entregado el ${esc(s.fecha||'')}</span><button class="btn alt sm" data-act="syundo" data-id="${s.id}">Deshacer entrega</button>`:`<button class="btn sig" data-act="syentregar" data-id="${s.id}" ${e.puede?'':'disabled'}>Entregar sistema</button>${e.motivos.map(w=>`<span style="color:var(--warn);font-size:12px">${esc(w)}</span>`).join(' ')}`}<button class="ghost" data-act="sydel" data-id="${s.id}" style="margin-left:auto">Eliminar</button></div></div>`}).join('');
  return stats+form+(cards||emptyBox('Aún no hay sistemas','Crea el primero: tablero eléctrico, red de agua, desagües, gas, datos o A/A.'));
};
EXT.act.syadd=()=>{
  const t=val('sy_t'),n=val('sy_n');if(!n)return toast('Escribe el nombre del sistema.');
  const p=PROTOCOLO[t];
  S.cx.push({id:uid(),name:n,tipo:t,tag:val('sy_g'),loc:val('sy_l'),estado:'sin_iniciar',fecha:'',
    tests:[...p.previa.map(x=>({id:uid(),etapa:'previa',txt:x,res:'pendiente'})),...p.operacion.map(x=>({id:uid(),etapa:'operacion',txt:x,res:'pendiente'}))],inc:[]});
  save();
};
EXT.act.sydel=el=>{S.cx=S.cx.filter(s=>s.id!==el.dataset.id);save()};
EXT.act.syaddinc=el=>{const s=S.cx.find(x=>x.id===el.dataset.id),t=val('sy_i-'+s.id);if(!t)return toast('Describe la incidencia.');s.inc.push({id:uid(),txt:t,sev:val('sy_s-'+s.id),abierta:true});recalcular(s);save()};
EXT.act.syinc=el=>{const[a,b]=el.dataset.id.split('|'),s=S.cx.find(x=>x.id===a),i=s.inc.find(x=>x.id===b);i.abierta=!i.abierta;recalcular(s);save()};
EXT.act.syentregar=el=>{const s=S.cx.find(x=>x.id===el.dataset.id),e=estadoSistema(s);if(!e.puede)return toast(e.motivos[0]);s.estado='entregado';s.fecha=today();save()};
EXT.act.syundo=el=>{const s=S.cx.find(x=>x.id===el.dataset.id);s.estado='en_pruebas';s.fecha='';recalcular(s);save()};

/* ====== 2. NO CONFORMIDADES ====== */
const NC_ST={abierta:'Abierta',analizada:'Causa analizada',corregida:'Corregida',cerrada:'Cerrada',descartada:'Descartada'};
const NC_FLOW={abierta:['analizada','descartada'],analizada:['corregida','descartada'],corregida:['cerrada','analizada'],cerrada:[],descartada:['abierta']};
const NC_TIPO=['Material','Mano de obra','Diseño','Instalación MEP','Acabado'];
const NC_CAUSA=['Material defectuoso','Falta de supervisión','Error de diseño','Método de trabajo','Falta de coordinación','Otra'];
const ncAbierta=n=>!['cerrada','descartada'].includes(n.st);
EXT.views.ncr=function(){
  const L=S.ncr,ab=L.filter(ncAbierta);
  const form=`<div class="panel"><h3>Nueva no conformidad</h3><div class="row f">${field('Título',`<input id="nc_t" placeholder="Ej. Tubo de agua fuera del trazado">`)}${field('Tipo',sel('nc_y',NC_TIPO,'Instalación MEP'),160)}${field('Gravedad',sel('nc_g',GRAV,'grave'),120)}${field('Espacio',sel('nc_r',roomOpts()),160)}</div>
   <div class="row f">${field('Qué se encontró',`<input id="nc_d" placeholder="Descripción y ubicación">`)}<button class="btn" data-act="ncadd">Registrar</button></div></div>`;
  const cards=[...L].reverse().map(n=>`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><div><h3>${n.no} · ${esc(n.title)}</h3><small style="color:var(--mute)">${esc(n.type)} · ${esc(roomName(n.room))} · ${n.date}</small></div><div class="row" style="align-items:center"><span class="tag sev-${n.grav==='critica'?'alta':n.grav==='grave'?'media':'baja'}">${GRAV.find(x=>x[0]===n.grav)[1]}</span><span class="pill ${n.st==='cerrada'?'terminado':n.st==='abierta'?'':'proceso'}">${NC_ST[n.st]}</span></div></div>
   <p style="margin:0">${esc(n.desc)}</p>
   <div class="cols f">${field('Causa',`<select data-ncf="${n.id}|causa">${opts([['','—'],...NC_CAUSA],n.causa)}</select>`)}${field('Corrección',`<input data-ncf="${n.id}|correccion" value="${esc(n.correccion)}" placeholder="Qué se hará para repararlo">`)}${field('Prevención',`<input data-ncf="${n.id}|prevencion" value="${esc(n.prevencion)}" placeholder="Cómo evitar que se repita">`)}${field('Responsable',`<input data-ncf="${n.id}|resp" value="${esc(n.resp)}">`)}${field('Fecha límite',`<input type="date" data-ncf="${n.id}|limite" value="${esc(n.limite)}">`)}${field('Costo',`<input data-ncf="${n.id}|costo" value="${esc(n.costo)}" placeholder="0">`)}${field('Días de atraso',`<input type="number" data-ncf="${n.id}|dias" value="${esc(n.dias)}">`)}</div>
   <div class="row">${stBtns(NC_FLOW,NC_ST,n.st,'ncgo',n.id)}</div></div>`).join('');
  return `<div class="stats"><div><b>${L.length}</b><span>Registradas</span></div><div><b>${ab.length}</b><span>Abiertas</span></div><div><b>${ab.filter(n=>n.grav==='critica').length}</b><span>Críticas abiertas</span></div><div><b>${L.filter(n=>n.st==='cerrada').length}</b><span>Cerradas</span></div></div>`+form+(cards||emptyBox('Sin no conformidades','Anota aquí lo que no cumple con el diseño o la norma, con su causa y su corrección.'));
};
const nuevaNC=o=>S.ncr.push({id:uid(),no:'NC-'+String(S.ncr.length+1).padStart(3,'0'),st:'abierta',date:today(),causa:'',correccion:'',prevencion:'',resp:'',limite:'',costo:'',dias:'',...o});
EXT.act.ncadd=()=>{const t=val('nc_t');if(!t)return toast('Escribe el título.');nuevaNC({title:t,desc:val('nc_d'),type:val('nc_y'),grav:val('nc_g'),room:val('nc_r')});save()};
EXT.act.ncgo=el=>{const n=S.ncr.find(x=>x.id===el.dataset.id),to=el.dataset.to;if(!NC_FLOW[n.st].includes(to))return;
  if(to==='corregida'&&!n.correccion)return toast('Anota primero la corrección que se aplicó.');
  if(to==='cerrada'&&!n.prevencion)return toast('Para cerrar, anota cómo se evitará que se repita.');
  n.st=to;save()};

/* ====== 3. OBSERVACIONES (pendientes con revisión) ====== */
const OB_ST={pendiente:'Pendiente',corrigiendo:'En corrección',por_revisar:'Por revisar',aprobada:'Aprobada'};
const OB_FLOW={pendiente:['corrigiendo'],corrigiendo:['por_revisar','pendiente'],por_revisar:['aprobada','corrigiendo'],aprobada:['pendiente']};
const OB_BTN={pendiente:'Reabrir',corrigiendo:'Empezar corrección',por_revisar:'Enviar a revisión',aprobada:'Aprobar'};
const openP=x=>x.st!=='aprobada';
function punchRow(x,roomId){
  const botones=nextTo(OB_FLOW,x.st).map(t=>{
    const rechazo=x.st==='por_revisar'&&t==='corrigiendo',reabrir=x.st==='aprobada'&&t==='pendiente';
    const txt=rechazo?'Rechazar':reabrir?'Reabrir':t==='pendiente'?'Devolver':OB_BTN[t];
    return `<button class="btn alt sm" data-act="obgo" data-id="${roomId}|${x.id}" data-to="${t}">${txt}</button>`}).join('');
  return `<div class="item ${openP(x)?'':'done'}"><div class="it-h"><b style="flex:1;min-width:180px">${esc(x.text)}</b><span class="tag">${esc(x.tag)}</span><span class="tag sev-${x.sev}">${x.sev}</span><span class="pill ${x.st==='aprobada'?'terminado':x.st==='pendiente'?'':'proceso'}">${OB_ST[x.st]}</span><button class="ghost" data-act="obdel" data-id="${roomId}|${x.id}">✕</button></div>
   <div class="it-s">${esc(roomName(roomId))}${x.rechazos?` · rechazada ${x.rechazos} vez/veces`:''}${x.reab?` · reabierta ${x.reab} vez/veces`:''}</div>
   ${(x.photos||[]).length?`<div class="grid sm">${phHtml(x.photos)}</div>`:''}<div class="row">${botones}</div></div>`;
}
EXT.punchRow=punchRow;
EXT.views.punch=function(){
  const A=allPunch(),f=EXT.pf||'abiertas';
  const mostrar=A.filter(x=>f==='todas'||(f==='abiertas'?openP(x):!openP(x))).sort((a,b)=>SEV.indexOf(a.sev)-SEV.indexOf(b.sev));
  const on=c=>c?'style="border-color:var(--signal);color:var(--signal)"':'';
  return `<div class="stats"><div><b>${A.length}</b><span>Total</span></div><div><b>${A.filter(openP).length}</b><span>Abiertas</span></div><div><b>${A.filter(x=>x.st==='por_revisar').length}</b><span>Por revisar</span></div><div><b>${A.filter(x=>x.rechazos||x.reab).length}</b><span>Con retrabajo</span></div></div>
  <div class="panel"><div class="chips" style="margin:0;justify-content:flex-start"><button data-act="obf" data-id="abiertas" ${on(f==='abiertas')}>Abiertas</button><button data-act="obf" data-id="aprobadas" ${on(f==='aprobadas')}>Aprobadas</button><button data-act="obf" data-id="todas" ${on(f==='todas')}>Todas</button></div>
  ${mostrar.map(x=>punchRow(x,x.room.id)).join('')||'<div class="empty">Nada en esta vista. Registra observaciones desde la pestaña Observaciones de cada lámina.</div>'}</div>`;
};
EXT.act.obf=el=>{EXT.pf=el.dataset.id;render()};
const buscarOb=s=>{const[r,i]=s.split('|'),R=S.rooms.find(x=>x.id===r);return[R,R.punch.find(x=>x.id===i)]};
EXT.act.obgo=el=>{const[R,x]=buscarOb(el.dataset.id),to=el.dataset.to;if(!OB_FLOW[x.st].includes(to))return;
  if(x.st==='por_revisar'&&to==='corrigiendo')x.rechazos=(x.rechazos||0)+1;
  if(x.st==='aprobada'&&to==='pendiente')x.reab=(x.reab||0)+1;
  x.st=to;save()};
EXT.act.obdel=el=>{const[R,x]=buscarOb(el.dataset.id);R.punch=R.punch.filter(p=>p!==x);save()};

/* ====== 4. PRUEBAS E INSPECCIONES ====== */
const PLANTILLAS={
 'Presión de agua':[['Presión aplicada (bar)','num'],['Tiempo de prueba (h)','num'],['La presión se mantiene','sn'],['Uniones secas','sn']],
 'Aislamiento y tierra':[['Resistencia de aislamiento (MΩ)','num'],['Tierra continua en todas las tomas','sn'],['Polaridad verificada','sn'],['Protecciones coinciden con la planilla','sn']],
 'Desagües':[['Llenado sin pérdida','sn'],['Pendiente continua','sn'],['Sellos de sifón intactos','sn'],['Notas','txt']],
 'Hermeticidad de gas':[['Presión de prueba (bar)','num'],['Sin caída de presión en el tiempo fijado','sn'],['Sin fugas con espuma o detector','sn']],
 'Recepción de piso':[['Desnivel máximo (mm en 2 m)','num'],['Caída hacia el desagüe','sn'],['Piezas sin fisuras ni sonido hueco','sn'],['Juntas parejas','sn']],
 'Recepción de pintura':[['Superficie bien preparada','sn'],['Color parejo','sn'],['Sin chorreos ni marcas','sn'],['Valoración general (1-5)','num']],
 'Impermeabilización':[['Prueba de inundación 24 h sin pérdida','sn'],['Remates continuos','sn'],['Notas','txt']]};
EXT.views.insp=function(){

  const cards=[...L].reverse().map(n=>{const hecho=n.st==='realizada';return`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><div><h3>${esc(n.tpl)}</h3><small style="color:var(--mute)">${esc(roomName(n.room))} · ${n.date}</small></div><span class="pill ${n.res==='aprobada'?'terminado':n.res==='rechazada'?'':'proceso'}" ${n.res==='rechazada'?'style="background:var(--bad)"':''}>${hecho?(n.res==='aprobada'?'Aprobada':'Rechazada'):'Programada'}</span></div>
   ${n.items.map((it,k)=>`<div class="item" style="padding:7px 0"><div class="it-h"><span style="flex:1;min-width:200px">${esc(it.q)}</span>${
     it.t==='sn'?`<select class="mini" data-inr="${n.id}|${k}" ${hecho?'disabled':''}>${opts([['','—'],['si','Cumple'],['no','No cumple']],it.a)}</select>`:
     `<input style="width:${it.t==='txt'?240:100}px" data-inr="${n.id}|${k}" value="${esc(it.a)}" ${it.t==='num'?'type="number" step="any"':''} ${hecho?'disabled':''}>`}</div></div>`).join('')}
   <div class="row">${hecho?'':`<button class="btn sig sm" data-act="inreg" data-id="${n.id}">Registrar resultado</button>`}${n.res==='rechazada'?`<button class="btn alt sm" data-act="inrep" data-id="${n.id}">Reprogramar</button><button class="btn alt sm" data-act="inncr" data-id="${n.id}">Abrir no conformidad</button>`:''}<button class="ghost" data-act="indel" data-id="${n.id}" style="margin-left:auto">Eliminar</button></div></div>`}).join('');
  return `<div class="stats"><div><b>${L.length}</b><span>Pruebas</span></div><div><b>${L.filter(i=>i.st!=='realizada').length}</b><span>Por realizar</span></div><div><b>${L.filter(i=>i.res==='aprobada').length}</b><span>Aprobadas</span></div><div><b>${L.filter(i=>i.res==='rechazada').length}</b><span>Rechazadas</span></div></div>`+form+(cards||emptyBox('Sin pruebas programadas','Programa presión de agua, aislamiento eléctrico, desagües, gas, pisos o pintura y anota el resultado de cada punto.'));
};
EXT.act.inadd=()=>{const t=val('in_t');S.insp.push({id:uid(),tpl:t,room:val('in_r'),date:val('in_d')||today(),st:'programada',res:'',items:PLANTILLAS[t].map(([q,ty])=>({q,t:ty,a:''}))});save()};
EXT.act.inreg=el=>{const n=S.insp.find(x=>x.id===el.dataset.id),sn=n.items.filter(i=>i.t==='sn');
  if(sn.some(i=>!i.a))return toast('Responde todos los puntos de cumple o no cumple.');
  n.res=sn.some(i=>i.a==='no')?'rechazada':'aprobada';n.st='realizada';save()};
EXT.act.inrep=el=>{const n=S.insp.find(x=>x.id===el.dataset.id);n.st='programada';n.res='';n.items.forEach(i=>i.a='');save()};
EXT.act.indel=el=>{S.insp=S.insp.filter(x=>x.id!==el.dataset.id);save()};
EXT.act.inncr=el=>{const n=S.insp.find(x=>x.id===el.dataset.id);
  nuevaNC({title:'Prueba rechazada: '+n.tpl,desc:n.items.filter(i=>i.a==='no').map(i=>i.q).join('; '),type:'Instalación MEP',grav:'grave',room:n.room,origen:n.id});
  jtab='ncr';save()};

/* ====== 5. MATERIALES EN OBRA ====== */
const MOV=[['in','Ingreso a obra'],['use','Consumo (instalado)'],['waste','Desperdicio o pérdida']];
function saldos(){
  const m={};
  S.mat.forEach(x=>{const k=x.item.trim().toLowerCase()+'|'+x.unit;const o=m[k]=m[k]||{item:x.item,unit:x.unit,in:0,use:0,waste:0,costo:0};const q=Number(x.qty)||0;o[x.type]+=q;if(x.type==='in')o.costo+=q*(Number(x.price)||0)});
  return Object.values(m).map(o=>({...o,saldo:o.in-o.use-o.waste,merma:o.in?o.waste/o.in*100:null}));
}
EXT.views.mat=function(){
  const st=saldos(),costo=st.reduce((a,o)=>a+o.costo,0),mermas=st.filter(o=>o.merma!==null).map(o=>o.merma);
  const form=`<div class="panel"><h3>Movimiento de material</h3><div class="row f">${field('Tipo',sel('mv_t',MOV,'in'),170)}${field('Material',`<input id="mv_i" list="mv_l" placeholder="Ej. Tubería PVC 1/2&quot;"><datalist id="mv_l">${[...new Set(S.mat.map(x=>x.item))].map(i=>`<option value="${esc(i)}">`).join('')}</datalist>`)}${field('Cantidad',`<input id="mv_q" type="number" step="any" min="0">`,90)}${field('Unidad',`<input id="mv_u" value="und">`,80)}${field('Costo unit.',`<input id="mv_p" type="number" step="any" min="0" placeholder="opcional">`,110)}${field('Espacio',sel('mv_r',roomOpts()),150)}${field('Fecha',`<input id="mv_d" type="date" value="${today()}">`,140)}<button class="btn" data-act="mvadd">Registrar</button></div></div>`;
  return `<div class="stats"><div><b>${st.length}</b><span>Materiales</span></div><div><b>${st.filter(o=>o.saldo<0).length}</b><span>Saldo negativo</span></div><div><b>${mermas.length?Math.round(avg(mermas))+'%':'—'}</b><span>Desperdicio medio</span></div><div><b>${Math.round(costo).toLocaleString('es')}</b><span>Costo de ingresos</span></div></div>`+form+
  `<div class="panel"><h3>Saldo en obra</h3>${st.length?`<div class="tw"><table><tr><th>Material</th><th>Ingresó</th><th>Instalado</th><th>Perdido</th><th>Saldo</th><th>Desperdicio</th></tr>${st.map(o=>`<tr><td><b>${esc(o.item)}</b></td><td>${o.in} ${esc(o.unit)}</td><td>${o.use}</td><td>${o.waste}</td><td style="font-weight:700;color:${o.saldo<0?'var(--bad)':'inherit'}">${Math.round(o.saldo*100)/100} ${esc(o.unit)}</td><td style="color:${o.merma>10?'var(--bad)':'inherit'}">${o.merma===null?'—':Math.round(o.merma)+'%'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Registra lo que llega a obra y lo que se instala; el saldo se calcula solo.</div>'}</div>`+
  (S.mat.length?`<div class="panel"><h3>Movimientos</h3>${[...S.mat].reverse().slice(0,30).map(x=>`<div class="hb"><span>${esc(x.item)} · ${x.qty} ${esc(x.unit)}</span><span class="tag">${MOV.find(m=>m[0]===x.type)[1]}</span><b class="mono">${x.date} · ${esc(roomName(x.room))} <button class="ghost" data-act="mvdel" data-id="${x.id}">✕</button></b></div>`).join('')}</div>`:'');
};

EXT.migrate=s=>{
  const m1={not_started:'sin_iniciar',in_progress:'en_pruebas',tests_complete:'listo',commissioned:'entregado'};
  s.cx=(s.cx||[]).map(x=>x.tests?x:({id:x.id,name:x.name,tipo:x.type,tag:x.tag,loc:x.loc,estado:m1[x.status]||'sin_iniciar',fecha:x.at||'',
    tests:(x.checks||[]).map(c=>({id:c.id,etapa:c.kind==='fun'?'operacion':'previa',txt:c.text,res:({pending:'pendiente',pass:'ok',fail:'falla',na:'na'})[c.st]||'pendiente'})),
    inc:(x.issues||[]).map(i=>({id:i.id,txt:i.text,sev:i.sev==='critical'||i.sev==='high'?'alta':i.sev==='medium'?'media':'baja',abierta:i.open,ref:i.ref}))}));
  const m2={identified:'abierta',under_review:'analizada',corrective_action:'analizada',verification:'corregida',closed:'cerrada',void:'descartada'};
  s.ncr=(s.ncr||[]).map(n=>n.grav?n:({...n,no:(n.no||'').replace('NCR','NC'),st:m2[n.st]||'abierta',grav:({minor:'leve',major:'grave',critical:'critica'})[n.sev]||'grave',causa:n.cause||'',correccion:n.corrective||'',prevencion:n.preventive||'',resp:'',limite:'',costo:n.cost||'',dias:n.days||''}));
  const m3={open:'pendiente',assigned:'pendiente',in_progress:'corrigiendo',resolved:'por_revisar',verified:'aprobada',closed:'aprobada'};
  s.rooms.forEach(r=>r.punch.forEach(x=>{if(m3[x.st])x.st=m3[x.st];if(x.reopened&&!x.reab){x.reab=x.reopened}}));
  const m4={scheduled:'programada',in_progress:'programada',completed:'realizada',failed:'realizada',cancelled:'programada'};
  s.insp=(s.insp||[]).map(i=>i.res!==undefined?i:({...i,st:m4[i.st]||'programada',res:i.st==='completed'?'aprobada':i.st==='failed'?'rechazada':'',
    items:(i.items||[]).map(it=>({...it,t:({pass_fail:'sn',numeric:'num',text:'txt',rating:'num'})[it.t]||it.t,a:it.a==='pass'?'si':it.a==='fail'?'no':it.a}))}));
  return s;
};

function searchAll(q){
  q=q.trim().toLowerCase();if(q.length<2)return[];
  const has=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(q)),out=[];
  S.rooms.forEach(r=>{
    if(has(r.name))out.push({t:'Espacio',l:r.name,go:`room|${r.id}|registro`});
    r.mep.forEach(i=>{if(has(i.kind,i.loc,i.tag,i.disc))out.push({t:'MEP',l:`${i.kind} · ${i.loc||'sin ubicación'} · ${r.name}`,go:`room|${r.id}|mep`})});
    r.fin.forEach(i=>{if(has(i.el,i.mat,i.ref))out.push({t:'Acabado',l:`${i.el}: ${i.mat} · ${r.name}`,go:`room|${r.id}|acabados`})});
    r.punch.forEach(i=>{if(has(i.text))out.push({t:'Observación',l:`${i.text} · ${r.name}`,go:`room|${r.id}|observ`})});
    r.visits.forEach(v=>{if(has(v.note))out.push({t:'Visita',l:`${v.date} · ${v.note} · ${r.name}`,go:`room|${r.id}|registro`})});
  });
  S.ncr.forEach(n=>{if(has(n.title,n.no,n.desc))out.push({t:'No conformidad',l:`${n.no} · ${n.title}`,go:'joint|ncr'})});
  S.cx.forEach(c=>{if(has(c.name,c.tag))out.push({t:'Sistema',l:c.name,go:'joint|cx'})});
  S.mat.forEach(m=>{if(has(m.item))out.push({t:'Material',l:m.item,go:'joint|mat'})});
  return out.slice(0,9);
}

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=2?2:n<=5?5:10)*p}
function lineChart(labels,series){
  const W=640,H=250,L=34,R=12,T=14,B=30,max=niceMax(Math.max(1,...series.flatMap(s=>s.data))),iw=W-L-R,ih=H-T-B;
  const x=i=>L+(labels.length<2?iw/2:i*iw/(labels.length-1)),y=v=>T+ih-(v/max)*ih;
  const ticks=[0,1,2,3,4].map(k=>Math.round(max*k/4*10)/10);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Actividad semanal">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${L-8}" y="${y(t)+4}" class="ax" text-anchor="end">${t}</text>`).join('')}
   ${labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" class="ax" text-anchor="middle">${l}</text>`).join('')}
   ${series.map(s=>`<path d="${s.data.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ')} L${x(s.data.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="${s.color}" opacity=".07"/>
    <path d="${s.data.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${s.data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.data.length-1?5:3}" fill="${i===s.data.length-1?s.color:'var(--sheet)'}" stroke="${s.color}" stroke-width="2"><title>${s.name} · ${labels[i]}: ${v}</title></circle>`).join('')}`).join('')}
  </svg>`;
}
function donut(parts,center,sub){
  const n=parts.reduce((a,p)=>a+p.v,0);let acc=0;
  const grad=n?parts.filter(p=>p.v).map(p=>{const a=acc/n*100;acc+=p.v;return`${p.c} ${a}% ${acc/n*100}%`}).join(','):'var(--rule) 0 100%';
  return `<div class="dn"><div class="donut2" style="background:conic-gradient(${grad})"><div><b>${center}</b><small>${sub}</small></div></div>
   <div class="lgd">${parts.map(p=>`<div><i style="background:${p.c}"></i><span>${p.l}</span><b>${p.v}</b></div>`).join('')}</div></div>`;
}

async function drive(tool,input){
  const r=await mcp.callTool(SERVER,tool,input);
  let p=r.payload;
  if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
  return p;
}
const files=p=>Array.isArray(p)?p:(p&&p.files)||[];
async function findOrCreate(title,parent){
  const q=`title = '${title}' and mimeType = 'application/vnd.google-apps.folder' and owner = 'me'`+(parent?` and parentId = '${parent}'`:'');
  const f=files(await drive('search_files',{query:q,excludeContentSnippets:true}))[0];
  if(f)return f.id;
  const c=await drive('create_file',{title,mimeType:'application/vnd.google-apps.folder',...(parent?{parentId:parent}:{})});
  return c.id;
}
async function ensureFolders(){
  if(!F.root)F.root=await findOrCreate(ROOT_NAME);
  if(!F.state)F.state=await findOrCreate('_estado',F.root);
}
const b64utf8=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function normalize(s){
  s.v=2;s.project=Object.assign({name:'Remodelación segundo piso',address:'',owner:'',lead:'',start:today()},s.project);
  s.rooms=(s.rooms||[]).map(r=>Object.assign(mkRoom(r.name),r,{mep:r.mep||[],fin:r.fin||[],punch:(r.punch||[]).map(x=>x.st?x:{...x,st:x.done?'aprobada':'pendiente'}),plans:r.plans||[],visits:r.visits||[]}));
  ['cx','ncr','insp','mat','plan'].forEach(k=>s[k]=s[k]||[]);
  EXT.migrate(s);
  return s;
}
async function loadState(){
  await ensureFolders();
  const list=files(await drive('search_files',{query:`parentId = '${F.state}' and title contains 'estado-'`,excludeContentSnippets:true,pageSize:50}))
    .filter(f=>/^estado-\d+\.json$/.test(f.title)).sort((a,b)=>b.title.localeCompare(a.title));
  if(!list.length)return normalize({});
  const d=await drive('download_file_content',{fileId:list[0].id});
  return normalize(JSON.parse(b64utf8(d.content)));
}
let saving=false,dirty=false,timer=null;
function touch(){dirty=true;setSync('saving');clearTimeout(timer);timer=setTimeout(persist,1200)}
async function persist(){
  if(saving)return;saving=true;dirty=false;
  try{
    await ensureFolders();
    await drive('create_file',{title:`estado-${String(Date.now()).padStart(13,'0')}.json`,parentId:F.state,contentMimeType:'application/json',disableConversionToGoogleType:true,textContent:JSON.stringify(S)});
    setSync(dirty?'saving':'ok',new Date());
    prune();
  }catch(e){setSync('err',e)}
  finally{saving=false;if(dirty)persist()}
}
async function prune(){
  try{
    const list=files(await drive('search_files',{query:`parentId = '${F.state}' and title contains 'estado-'`,excludeContentSnippets:true,pageSize:50}))
      .filter(f=>/^estado-\d+\.json$/.test(f.title)).sort((a,b)=>b.title.localeCompare(a.title));
    for(const f of list.slice(12))await drive('trash_file',{fileId:f.id});
  }catch(e){}
}
function setSync(s,x){
  sync={s,x};const el=$('#sync');if(!el)return;
  el.className='sync '+(s==='ok'?'':s);
  el.querySelector('span').textContent=s==='saving'?(BACKEND==='local'?'Guardando…':'Guardando en Drive…'):s==='ok'?(BACKEND==='local'?'Guardado en este navegador ':'Guardado en Drive ')+(x?x.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):''):s==='err'?'Sin guardar · reintentar':'Sin conexión';
  el.onclick=s==='err'?()=>persist():null;
}
function errText(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return['Tu conexión con Google Drive venció.','Reconéctala en Configuración → Conectores de claude.ai y recarga esta página.'];
  if(c==='server_not_connected'||c==='selection_required')return['Google Drive no está conectado.','Esta app guarda en Drive a través de claude.ai. Ábrela desde claude.ai o agrega el conector en Configuración → Conectores.'];
  if(c==='not_in_manifest')return['No permitiste el acceso a Google Drive.','Recarga la página y acepta el permiso para guardar tu bitácora.'];
  if(c==='blocked_by_policy'||c==='approval_required')return['Tu organización bloquea esta acción en Drive.','Pide al administrador que la habilite.'];
  return['No se pudo hablar con Google Drive.',(e&&e.message)||'Intenta de nuevo en unos segundos.'];
}

const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
function shrink(file,max=1400,q=.8){
  return new Promise(res=>{
    const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b),'image/jpeg',q)};
    i.onerror=()=>{URL.revokeObjectURL(u);res(null)};i.src=u;
  });
}
async function roomFolder(r){
  if(r.folderId)return r.folderId;
  await ensureFolders();
  r.folderId=await findOrCreate(`${pad(S.rooms.indexOf(r)+1)} ${r.name.replace(/'/g,'')}`,F.root);
  return r.folderId;

async function upload(r,title,blob,mime){
  const parentId=await roomFolder(r);
  if(blob.size>700000)throw{code:'bad_request',message:'El archivo supera 700 KB. Reduce su tamaño o súbelo como imagen.'};
  const c=await drive('create_file',{title,parentId,contentMimeType:mime,disableConversionToGoogleType:true,base64Content:await toB64(blob)});
  return c.id;
}
async function uploadPhotos(r,fl,prefix){
  const out=[];
  for(const f of fl){const b=await shrink(f);if(!b)continue;const name=`${prefix} · ${uid().slice(0,5)}.jpg`;out.push({id:await upload(r,name,b,'image/jpeg'),name})}
  return out;
}
const cache=new Map();let active=0;const queue=[];
function pump(){while(active<3&&queue.length){const j=queue.shift();active++;j().finally(()=>{active--;pump()})}}
function fileURL(id){
  if(!cache.has(id))cache.set(id,new Promise((res,rej)=>{
    queue.push(()=>drive('download_file_content',{fileId:id}).then(d=>res(`data:${d.mimeType||'image/jpeg'};base64,${d.content}`),e=>{cache.delete(id);rej(e)}));pump();
  }));
  return cache.get(id);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target;
  fileURL(el.dataset.fid).then(u=>{el.classList.add('ok');el.innerHTML=`<img src="${u}" alt="">`}).catch(()=>{el.innerHTML='<div style="padding:10px;font-size:11px;color:var(--mute)">No se pudo cargar</div>'})}),{rootMargin:'200px'});

   ${DISC.map(d=>{const a=M.filter(i=>i.disc===d);if(!a.length)return'';const c=MEP_ST.map(([k])=>a.filter(i=>i.st===k).reduce((s,i)=>s+Math.max(1,qtyOf(i)),0));return`<div class="hb2"><span>${d}</span>${stacked(c,MEPCOL)}<b>${c.reduce((x,y)=>x+y,0)}</b></div>`}).join('')}

   ${S.rooms.map(r=>`<tr class="go" data-act="go" data-id="${r.id}" data-t="mep"><td><b>${esc(r.name)}</b></td>${DISC.map(d=>{const a=r.mep.filter(i=>i.disc===d);if(!a.length)return'<td class="z">·</td>';const p=Math.round(avg(a.map(i=>wMep(i.st)))*100);return`<td style="background:color-mix(in srgb,var(--ok) ${p}%,var(--sheet))">${a.length}</td>`}).join('')}</tr>`).join('')}</table></div>

function dashVisitas(){
  if(!S.rooms.length)return emptyRooms();
  const set={};S.rooms.forEach(r=>r.visits.forEach(v=>{(set[v.date]=set[v.date]||new Set()).add(r.id)}));
  const now=new Date(today()+'T12:00'),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7)-49);
  let due=0,hit=0;const weeks=[];
  for(let w=0;w<8;w++){const col=[];for(const off of[0,2,5]){const d=new Date(mon);d.setDate(mon.getDate()+w*7+off);
    const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,k=set[s]?set[s].size:0,past=d<now&&s!==today(),isT=s===today();
    if(past||isT&&k){due++;if(k)hit++}
    col.push(`<div class="cell ${k?'hit':past?'miss':isT?'now':''}" title="${s}: ${k} espacios">${k||''}</div>`)}
    const wd=new Date(mon);wd.setDate(mon.getDate()+w*7);weeks.push(`<div class="wk"><small>${wd.getDate()}/${wd.getMonth()+1}</small>${col.join('')}</div>`)}
  const rows=S.rooms.map(r=>({r,l:lastVisit(r)})).sort((a,b)=>(a.l||'').localeCompare(b.l||''));
  return `<div class="dgrid"><div class="panel"><h3>Cumplimiento de visitas · últimas 8 semanas</h3>
   <div class="row" style="align-items:center;gap:20px"><div class="donut" style="background:conic-gradient(var(--ok) 0 ${pct(hit,due)}%,var(--rule) ${pct(hit,due)}% 100%)"><b>${pct(hit,due)}%</b></div><div class="lg"><div>${hit} de ${due} días de obra con registro</div><div style="color:var(--mute)">Lunes, miércoles y sábado</div></div></div>
   <div class="cal"><div class="wk lab"><small></small><div>Lun</div><div>Mié</div><div>Sáb</div></div>${weeks.join('')}</div></div>
   <div class="panel"><h3>Última visita por espacio</h3>${rows.map(({r,l})=>{const d=l?dayDiff(l):null;return`<div class="hb" data-act="go" data-id="${r.id}"><span>${esc(r.name)}</span><span style="font:12px var(--mono);color:${d===null||d>4?'var(--signal)':'var(--mute)'}">${d===null?'sin registros':d===0?'hoy':'hace '+d+' d'}</span><b></b></div>`}).join('')}</div></div>`;
}

  return `<div class="panel f"><h3>Alcance y notas técnicas</h3>
   <div><label>Alcance de la remodelación en este espacio</label><textarea data-rf="scope" placeholder="Demolición, redes, muros, pisos, acabados…">${esc(r.scope)}</textarea></div>
   <div><label>Notas técnicas y decisiones</label><textarea data-rf="notes" placeholder="Condiciones encontradas, cambios aprobados, pendientes con el cliente…">${esc(r.notes)}</textarea></div></div>`;
}

/* ---------- acciones ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function fail(e){const[t,m]=errText(e);toast(t+' '+m)}
function go(id){view=id;draft={files:[]};try{localStorage.setItem('bo-view',id)}catch(e){}render();$('#main')?.scrollTo(0,0)}
function addRoom(n){const r=mkRoom(n);S.rooms.push(r);touch();view=r.id;tab='registro';render()}
const val=id=>($('#'+id)?.value||'').trim();

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el||!S)return;
  const a=el.dataset.act,r=room(),id=el.dataset.id;
  if(a==='go'){if(el.dataset.t)tab=el.dataset.t;return go(id)}
  if(a==='quick')return addRoom(el.dataset.n);
  if(a==='jtab'){jtab=el.dataset.v;view='joint';render();$('#main')?.scrollTo(0,0);return}
  if(a==='gf'){jgf=id;return render()}
  if(a==='gt'){jgt=id;return render()}
  if(a==='zoom'){const im=el.querySelector('img');if(im){$('#lbi').src=im.src;$('#lb').classList.add('on')}return}
  if(a==='tab'){tab=el.dataset.v;return render()}
  if(a==='status'){r.status=el.dataset.v;touch();return render()}
  if(a==='delroom'){if(el.dataset.c){S.rooms=S.rooms.filter(x=>x!==r);view='joint';touch();return render()}el.dataset.c=1;el.textContent='Confirmar: se quita del proyecto (los archivos quedan en Drive)';return}
  if(a==='addmep'){r.mep.push({id:uid(),disc:val('md'),kind:val('mk'),qty:Number(val('mq'))||1,loc:val('ml'),tag:val('mt'),st:'proyectado',date:today(),photos:[]});draft.md=val('md');touch();return render()}
  if(a==='delmep'){r.mep=r.mep.filter(x=>x.id!==id);touch();return render()}
  if(a==='addfin'){if(!val('fm'))return toast('Escribe el material.');r.fin.push({id:uid(),el:val('fe'),mat:val('fm'),ref:val('fr'),qty:val('fq'),unit:val('fu'),st:'por comprar'});touch();return render()}
  if(a==='delfin'){r.fin=r.fin.filter(x=>x.id!==id);touch();return render()}
  if(a==='addpunch')return addPunch(el);
  if(a==='delplan'){r.plans=r.plans.filter(x=>x.id!==id);touch();return render()}
  if(a==='delvisit'){r.visits=r.visits.filter(x=>x.id!==id);touch();return render()}
  if(a==='savevisit')return saveVisit(el);
  if(a==='report')return report(el);
  if(EXT.act[a])return EXT.act[a](el);
});
document.addEventListener('change',async ev=>{
  const t=ev.target;if(!S)return;
  if(EXT.change(t))return;
  if(t.dataset.pf){S.project[t.dataset.pf]=t.value;touch();if(t.dataset.pf==='name')render();return}
  if(t.dataset.rf){const r=room();r[t.dataset.rf]=t.value;touch();if(t.dataset.rf==='name')render();return}
  if(t.dataset.mst){const i=room().mep.find(x=>x.id===t.dataset.mst);i.st=t.value;touch();
    if(i.st==='cerrado'&&!(i.photos||[]).length)toast('Cierra solo con foto: agrega la foto de la red antes de tapar.');return render()}
  if(t.dataset.fst){room().fin.find(x=>x.id===t.dataset.fst).st=t.value;touch();return render()}
  if(t.dataset.mph){const r=room(),i=r.mep.find(x=>x.id===t.dataset.mph);
    try{toast('Subiendo foto…');const ph=await uploadPhotos(r,t.files,`MEP · ${i.disc} · ${i.kind}`);i.photos=[...(i.photos||[]),...ph];touch();toast('Foto guardada en Drive');render()}catch(e){fail(e)}return}
  if(t.id==='md'){draft.md=t.value;$('#mk').innerHTML=opts(KINDS[t.value]);return}
  if(t.id==='vd')draft.date=t.value;
  if(t.id==='vn')draft.note=t.value;
  if(t.id==='vt')draft.tag=t.value;
  if(t.id==='vf')addDraft(t.files);
  if(t.id==='pf')addPlans(t.files);
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='addf')return;ev.preventDefault();
  const n=$('#newname').value.trim();if(n)addRoom(n);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')$('#lb').classList.remove('on')});
document.addEventListener('input',ev=>{if(ev.target.id==='vn')draft.note=ev.target.value});
['dragover','drop'].forEach(n=>document.addEventListener(n,ev=>{
  const z=ev.target.closest('#drop,#pdrop');if(!z)return;ev.preventDefault();
  z.classList.toggle('over',n==='dragover');
  if(n==='drop')z.id==='drop'?addDraft(ev.dataTransfer.files):addPlans(ev.dataTransfer.files);
}));

let pendingDraft=Promise.resolve();
function addDraft(fl){
  const list=[...fl];
  pendingDraft=pendingDraft.then(async()=>{
    for(const f of list){const b=await shrink(f);if(b)draft.files.push({blob:b,url:URL.createObjectURL(b)})}
    draft.date=$('#vd')?.value;draft.note=$('#vn')?.value;draft.tag=$('#vt')?.value;draft.w=$('#vw')?.value;draft.p=$('#vp')?.value;render();
  });
  return pendingDraft;
}
async function saveVisit(btn){
  await pendingDraft;
  const r=room(),note=val('vn'),date=$('#vd').value||today(),tag=$('#vt').value;
  if(!note&&!draft.files.length)return toast('Escribe una observación o agrega fotos.');
  btn.disabled=true;const photos=[];
  try{
        let k=0;
    for(const f of draft.files){btn.textContent=`Subiendo foto ${++k} de ${draft.files.length}…`;
      const name=`${date} · ${tag} · ${uid().slice(0,5)}.jpg`;photos.push({id:await upload(r,name,f.blob,'image/jpeg'),name})}
    r.visits.push({id:uid(),date,note,tag,photos,w:val('vw'),p:val('vp'),delay:val('vx')});if(r.status==='pendiente')r.status='proceso';
    draft={files:[]};touch();toast('Visita guardada en Drive');render();
  }catch(e){fail(e);btn.disabled=false;btn.textContent='Guardar visita en Drive'}
}
async function addPunch(btn){
  const r=room(),text=val('ot');if(!text)return toast('Describe la observación.');
  btn.disabled=true;
  try{const ph=await uploadPhotos(r,$('#oph').files,`OBS · ${$('#og').value}`);
    r.punch.push({id:uid(),text,tag:$('#og').value,sev:$('#os').value,st:'pendiente',date:today(),photos:ph});touch();render()}
  catch(e){fail(e);btn.disabled=false}
}
async function addPlans(fl){
  const r=room();
  try{for(const f of fl){
    const isImg=f.type.startsWith('image/');const b=isImg?await shrink(f,2400,.85):f;
    const id=await upload(r,'PLANO · '+f.name,b,isImg?'image/jpeg':f.type);
    r.plans.push({id,name:f.name,mime:isImg?'image/jpeg':f.type});}
    touch();toast('Planos guardados en Drive');render()}
  catch(e){fail(e)}
}

/* informe final (Google Doc) */
async function thumb(id){
  const u=await fileURL(id);
  return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res('');i.src=u});
}
const stL=(arr,k)=>(arr.find(x=>x[0]===k)||[0,k])[1];
async function report(btn){
  btn.disabled=true;const p=S.project;
  try{
    let h=`<h1>${esc(p.name)}</h1><p>${esc(p.address)}</p><p><b>Propietario:</b> ${esc(p.owner)||'—'}<br><b>Responsable técnico:</b> ${esc(p.lead)||'—'}</p><p><b>Avance general:</b> ${total()}%<br><b>Emitido:</b> ${today()}</p>
    <h2>Índice de láminas</h2><table border="1" cellpadding="5"><tr><th>Lámina</th><th>Espacio</th><th>Estado</th><th>Redes MEP</th><th>Acabados</th><th>Avance</th></tr>${S.rooms.map((r,i)=>`<tr><td>L-${pad(i+1)}</td><td>${esc(r.name)}</td><td>${STAT[r.status]}</td><td>${mepProg(r)??'—'}%</td><td>${finProg(r)??'—'}%</td><td>${prog(r)}%</td></tr>`).join('')}</table>`;
    h+=EXT.reportHtml();
    for(const[i,r]of S.rooms.entries()){
      btn.textContent=`Armando lámina ${i+1} de ${S.rooms.length}…`;
      h+=`<br style="page-break-before:always"><h1>L-${pad(i+1)} · ${esc(r.name)}</h1><table border="1" cellpadding="5"><tr><td><b>Nivel</b></td><td>${esc(r.level)}</td><td><b>Área</b></td><td>${esc(r.area)} m²</td></tr><tr><td><b>Escala</b></td><td>${esc(r.scale)}</td><td><b>Ref. plano</b></td><td>${esc(r.ref)}</td></tr><tr><td><b>Estado</b></td><td>${STAT[r.status]}</td><td><b>Avance</b></td><td>${prog(r)}%</td></tr></table>
      ${r.scope?`<h3>Alcance</h3><p>${esc(r.scope).replace(/\n/g,'<br>')}</p>`:''}
      ${r.mep.length?`<h3>Redes MEP</h3><table border="1" cellpadding="4"><tr><th>Disciplina</th><th>Punto</th><th>Cant.</th><th>Ubicación</th><th>Tag</th><th>Estado</th><th>Fotos</th></tr>${r.mep.map(x=>`<tr><td>${esc(x.disc)}</td><td>${esc(x.kind)}</td><td>${esc(x.qty)}</td><td>${esc(x.loc)}</td><td>${esc(x.tag)}</td><td>${stL(MEP_ST,x.st)}</td><td>${(x.photos||[]).length}</td></tr>`).join('')}</table>`:''}
      ${r.fin.length?`<h3>Cuadro de acabados</h3><table border="1" cellpadding="4"><tr><th>Elemento</th><th>Material</th><th>Ref.</th><th>Cantidad</th><th>Estado</th></tr>${r.fin.map(x=>`<tr><td>${esc(x.el)}</td><td>${esc(x.mat)}</td><td>${esc(x.ref)}</td><td>${esc(x.qty)} ${esc(x.unit)}</td><td>${stL(FIN_ST,x.st)}</td></tr>`).join('')}</table>`:''}
      ${r.punch.length?`<h3>Observaciones</h3><ul>${r.punch.map(x=>`<li>${openP(x)?'☐':'☑'} ${esc(x.text)} (${esc(x.tag)}, prioridad ${x.sev})</li>`).join('')}</ul>`:''}
      <h3>Registro de obra</h3>`;
      for(const v of [...r.visits].sort((a,b)=>a.date.localeCompare(b.date))){
        h+=`<p><b>${v.date}</b> · ${esc(v.tag||'General')} — ${esc(v.note)}</p>`;
        for(const f of v.photos.slice(0,8)){const t=await thumb(f.id).catch(()=>'');if(t)h+=`<img src="${t}" width="260"> `}
      }
    }
    btn.textContent='Subiendo informe…';
    const c=await drive('create_file',{title:`Informe de obra · ${p.name} · ${today()}`,parentId:F.root,contentMimeType:'text/html',textContent:`<html><body>${h}</body></html>`});
    toast('Informe creado en tu Drive');
    btn.outerHTML=`<a class="btn sig" href="${esc(c.viewUrl||'https://drive.google.com/drive/folders/'+F.root)}" target="_blank" rel="noopener">Abrir informe ↗</a>`;
  }catch(e){fail(e);btn.disabled=false;btn.textContent='Generar informe final en Drive'}
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    mcp=await window.claude?.use('mcp');
    if(!mcp)mcp=await chooseBackend();
    S=await loadState();
    try{const v=localStorage.getItem('bo-view');if(v&&S.rooms.some(r=>r.id===v))view=v}catch(e){}
    sync={s:'ok',x:null};render();
  }catch(e){fatal=e;render()}
})();
</script>
